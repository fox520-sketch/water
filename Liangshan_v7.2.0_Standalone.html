<title>水滸英雄傳：梁山風雲 v7.2.0 梁山聚義養成版</title>
<style>:root{
  color-scheme:light;
  --bg:#f3ead7;
  --paper:#fffaf0;

*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);background:
  radial-gradient(circle at 15% 0%,rgba(255,255,255,.75),transparent 30%),

}
body[data-theme="paper"]{
  color-scheme:light;--bg:#fff;--paper:#fff;--paper-2:#f6f6f6;--ink:#000;--muted:#333;--line:#000;--accent:#000;--accent-2:#333;--good:#000;--warn:#000;--danger:#000;--shadow:none
}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{display:grid;place-items:center;width:50px;height:50px;border:2px solid var(--accent);border-radius:50%;font-weight:900;font-size:22px;background:var(--paper);box-shadow:var(--shadow)}
.brand-text{min-width:0}.brand-text b{display:block;font-size:clamp(17px,2.6vw,23px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-text small{color:var(--muted)}
.top-actions,.actions,.inline-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;padding:clamp(24px,5vw,58px);border:1px solid var(--line);border-radius:28px;background:
  linear-gradient(125deg,color-mix(in srgb,var(--paper) 96%,transparent),color-mix(in srgb,var(--paper-2) 90%,transparent));box-shadow:var(--shadow)}
.hero:after{content:"梁山";position:absolute;right:-16px;bottom:-42px;font-size:clamp(90px,18vw,220px);font-weight:900;color:color-mix(in srgb,var(--accent) 7%,transparent);line-height:1;pointer-events:none}
.hero>*{position:relative;z-index:1}.eyebrow{font-weight:800;letter-spacing:.16em;color:var(--accent);font-size:13px;text-transform:uppercase}.hero h1{margin:.35em 0 .2em;font-size:clamp(34px,7vw,72px);line-height:1.08;letter-spacing:.02em}.hero h2{margin:0 0 14px;font-size:clamp(17px,3vw,27px);font-weight:650;color:var(--accent)}.hero p{max-width:780px;font-size:clamp(16px,2vw,19px);line-height:1.85;color:var(--muted)}
.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h2,.card h3{margin:0 0 10px}.card p{line-height:1.72;margin:.5em 0;color:var(--muted)}.card.success{border-color:var(--good);background:color-mix(in srgb,var(--paper) 92%,var(--good) 8%)}.card.warning{border-color:var(--warn)}.card.current{border:2px solid var(--accent)}
.metric{display:flex;justify-content:space-between;align-items:end;gap:10px}.metric strong{font-size:clamp(29px,4vw,46px);line-height:1;color:var(--accent)}.metric span{color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);padding:11px 17px;font-weight:750;text-decoration:none;cursor:pointer;transition:.16s transform,.16s background,.16s border-color;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px}.btn:hover{transform:translateY(-1px);border-color:var(--accent)}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.good{background:var(--good);border-color:var(--good);color:#fff}.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.btn.icon{width:44px;padding:0}.btn.small{min-height:36px;padding:7px 12px;font-size:14px}

.nav{position:sticky;top:8px;z-index:20;display:flex;gap:7px;align-items:center;overflow:auto;padding:8px;margin:0 0 16px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);box-shadow:var(--shadow)}.nav .btn{white-space:nowrap}.nav-spacer{flex:1}
.progress{height:12px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .25s}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 12px}.section-title h2{margin:0}.section-title p{margin:0;color:var(--muted)}
.chapter-toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:10px;margin:14px 0}.field{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--paper);color:var(--ink);padding:11px 13px;min-height:44px}
.chapter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.chapter-card{position:relative;text-align:left;min-height:190px;cursor:pointer;transition:.16s transform,.16s border-color}.chapter-card:hover{transform:translateY(-2px);border-color:var(--accent)}.chapter-card .chapter-no{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--accent);font-weight:900}.chapter-card .chapter-icon{font-size:34px}.chapter-card h3{font-size:18px;line-height:1.45;margin:10px 0 4px}.chapter-card p{font-size:14px}.chapter-card.completed:after{content:"✓";position:absolute;right:13px;bottom:10px;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--good);color:#fff;font-weight:900}.chapter-card.recommended{border:2px solid var(--accent)}
.portrait{display:flex;gap:14px;align-items:center}.avatar{display:grid;place-items:center;flex:0 0 auto;width:64px;height:64px;border-radius:19px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:28px;font-weight:900;border:2px solid color-mix(in srgb,var(--paper) 70%,transparent)}.portrait h3{margin:0}.portrait p{margin:3px 0}
.task-list{display:grid;gap:10px}.task{width:100%;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:15px;padding:13px;background:var(--paper);color:var(--ink);cursor:pointer}.task:hover:not(:disabled){border-color:var(--accent)}.task:disabled{opacity:.48;cursor:not-allowed}.task.done{border-color:var(--good);background:color-mix(in srgb,var(--paper) 92%,var(--good) 8%)}.task-icon{font-size:25px;text-align:center}.task b{display:block}.task small{display:block;margin-top:3px;color:var(--muted);line-height:1.5}.task-state{font-weight:900;color:var(--good)}
.status-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.statline{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;margin:10px 0;font-size:14px}.bar{height:13px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper-2)}.bar i{display:block;height:100%;background:var(--danger)}.bar.sp i{background:var(--accent-2)}
.battle-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fighter{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.fighter.enemy{border-color:color-mix(in srgb,var(--danger) 65%,var(--line))}.fighter-head{display:flex;justify-content:space-between;align-items:start;gap:12px}.battle-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:17px}.battle-actions .btn{border-radius:13px}.battle-note{margin-top:13px;padding:10px;border-radius:12px;background:var(--paper-2);color:var(--muted);font-size:14px}.log{max-height:250px;overflow:auto}.log div{padding:9px 0;border-bottom:1px dashed var(--line);line-height:1.55}.log div:first-child{color:var(--accent);font-weight:700}

.roster-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.roster-card{padding:14px}.roster-card .avatar{width:50px;height:50px;border-radius:15px;font-size:22px}.roster-card h3{font-size:16px}.roster-card p{font-size:13px}
.achievement{display:flex;gap:12px;align-items:start;padding:12px 0;border-bottom:1px dashed var(--line)}.achievement:last-child{border:0}.achievement .medal{font-size:27px}.achievement.locked{opacity:.5}
.modal-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.55);backdrop-filter:blur(5px)}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.35)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}.modal h2{margin:0}.modal textarea{width:100%;min-height:220px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper-2);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}.muted{color:var(--muted)}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:2px 5px;font-size:.9em}.noscript{margin:30px;padding:20px;border:2px solid #900}
@media(max-width:900px){.grid.three,.grid.four,.chapter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.roster-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.status-grid{grid-template-columns:1fr}}
@media(max-width:650px){#app{padding:12px 12px calc(70px + var(--safe-bottom))}.topbar{align-items:flex-start}.brand-mark{width:43px;height:43px}.top-actions .label{display:none}.grid.two,.grid.three,.grid.four,.chapter-grid,.battle-grid{grid-template-columns:1fr}.roster-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.chapter-toolbar{grid-template-columns:1fr 1fr}.chapter-toolbar input{grid-column:1/-1}.hero{padding:25px 20px}.hero h1{font-size:36px}.nav{top:4px;border-radius:16px}.battle-actions{grid-template-columns:1fr}.grade-badge{float:none;margin:0 0 14px}.chapter-card{min-height:0}.task{grid-template-columns:36px 1fr auto;padding:12px}.fighter{padding:16px}}

@media print{.topbar,.nav,.actions,.top-actions,.btn{display:none!important}body{background:#fff}#app{width:100%;padding:0}.card,.hero{box-shadow:none;break-inside:avoid}}

/* v7.1.0 百八英雄深度玩法版 */

@media(max-width:650px){.chapter-toolbar{grid-template-columns:1fr 1fr}.chapter-toolbar input{grid-column:1/-1}.shop-grid,.skill-panel{grid-template-columns:1fr}.flow-step{grid-template-columns:36px 1fr}.flow-step>.btn{grid-column:1/-1;width:100%}.update-banner{align-items:flex-start;flex-direction:column}.update-banner .actions{width:100%;flex-wrap:wrap}.update-banner .btn{flex:1}}

/* v7.2.0 梁山聚義養成版 */

.battle-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:var(--shadow)}.battle-toolbar b,.battle-toolbar small{display:block}.battle-toolbar small{color:var(--muted);margin-top:3px}.combat-board{display:grid;grid-template-columns:1fr 1fr;gap:16px}.combat-board h2{margin:0 0 10px}.combat-team{display:grid;gap:10px}.unit-card{width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;padding:13px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}button.unit-card{cursor:pointer}.unit-card.active{border:2px solid var(--good);background:color-mix(in srgb,var(--paper) 92%,var(--good) 8%)}.unit-card.targeted{border:2px solid var(--danger);background:color-mix(in srgb,var(--paper) 92%,var(--danger) 8%)}.unit-card.fallen{opacity:.42;filter:grayscale(1)}.unit-head{display:flex;gap:10px;align-items:center;margin-bottom:7px}.unit-head b,.unit-head small{display:block}.unit-head small{color:var(--muted);margin-top:2px}.small-avatar{width:42px;height:42px;border-radius:12px;font-size:19px}.mechanic-note{display:block;margin-top:8px;color:var(--danger);line-height:1.45}.active-panel{margin-top:16px}.active-panel .battle-actions{grid-template-columns:repeat(3,minmax(0,1fr))}

  function repairFormation(target=state){
    const seen=new Set(); const pool=[];
    [...(target.formation?.front||[]),...(target.formation?.back||[])].forEach(n=>{if(heroUnlockedForState(target,n)&&!seen.has(n)){seen.add(n);pool.push(n);}});
    for(let n=1;n<=108&&pool.length<4;n++) if(heroUnlockedForState(target,n)&&!seen.has(n)){seen.add(n);pool.push(n);}
    while(pool.length<4) pool.push(pool.length+1);
    target.formation={front:pool.slice(0,2),back:pool.slice(2,4)};
  }

  function stepDone(run,step){if(step.type==='clue')return run.clues.includes(step.index);if(step.type==='strategy')return run.strategies.includes(step.index);if(step.type==='battle')return Boolean(run.battles[String(step.index)]);if(step.type==='finish')return Boolean(run.complete);return false;}

  function enemyName(ch,stage,index){
    const prefixes=[['攔路惡徒','巡哨弓手'],['偽冊頭目','護衛刀手','暗哨術士'],['幕後黑主','親兵頭目','邪陣軍師']][stage];

  }

  function makeEnemy(ch,stage,index,difficulty){
    const d=DIFFICULTIES[difficulty]||DIFFICULTIES.standard; const scale=1+(ch.number-1)*.006; const isBoss=stage===2&&index===0;
    const hpBase=isBoss?1350:(stage===1?520:420); const atkBase=isBoss?74:(stage===1?49:42); const defBase=isBoss?32:(stage===1?20:15);

    return {id:`e-${stage}-${index}`,name:enemyName(ch,stage,index),icon:isBoss?'👹':index%2?'🏹':'⚔️',type:isBoss?'boss':(index%3===2?'caster':'minion'),maxHp:hp,hp,atk:Math.round(atkBase*scale*d.atk*(index===0?1:.88)),def:Math.round(defBase*scale),alive:true,statuses:{},shield:isBoss&&bossProfile(ch).key==='armor'?Math.round(hp*.22):0,phase:1,mechanic:isBoss?bossProfile(ch):null,bonusSilver:0};
  }

  function startBattle(stage){

    if(s===2)run.battle.log.unshift(`首領機制「${enemies[0].mechanic.name}」啟動：${enemies[0].mechanic.text}`);
    party.forEach(a=>{getHero(a.number).battles++;}); screen='battle'; save(true); renderBattle(); tone('battle'); queueAuto();

  function aliveAllies(b=state.current?.battle){return b?b.allies.filter(x=>x.alive&&x.hp>0):[];}
  function aliveEnemies(b=state.current?.battle){return b?b.enemies.filter(x=>x.alive&&x.hp>0):[];}
  function activeAlly(b=state.current?.battle){
    if(!b)return null; for(let k=0;k<b.allies.length;k++){const i=(b.activeIndex+k)%b.allies.length;if(b.allies[i].alive&&b.allies[i].hp>0){b.activeIndex=i;return b.allies[i];}}return null;
  }
  function selectedEnemy(b=state.current?.battle){

  }

  function addStatus(entity,key,duration=2,power=1){entity.statuses=entity.statuses||{};const old=entity.statuses[key]||{duration:0,power:0};entity.statuses[key]={duration:Math.max(old.duration,duration),power:Math.max(old.power,power)};}
  function statusLabel(key){return ({poison:'中毒',burn:'燃燒',bleed:'流血',stun:'暈眩',armorBreak:'破甲',power:'鼓舞',slow:'弱化'})[key]||key;}

  function applyHit(target,amount,{pierce=false,crit=false,source='攻擊'}={}){
    if(!target||!target.alive)return 0; let damage=Math.max(1,Math.round(amount));
    if(target.shield>0&&!pierce){const absorb=Math.min(target.shield,damage);target.shield-=absorb;damage-=absorb;if(absorb)state.current.battle.log.unshift(`${target.name}的護盾吸收 ${absorb} 傷害。`);}
    target.hp=Math.max(0,target.hp-damage);if(target.hp<=0){target.alive=false;state.current.battle.log.unshift(`${target.name}已被擊破。`);} if(crit)state.current.battle.log.unshift(`${source}觸發暴擊！`); return damage;
  }

  function effectiveDef(target){const broken=target.statuses?.armorBreak?.duration>0?.72:1;return Math.max(0,target.def*broken);}
  function skillCost(ally,type){const tactics=getHero(ally.number).tree.tactics;const civic=ally.kind==='civic'?8:0;return type==='skill'?Math.max(38,60-tactics*4-civic):Math.max(72,100-tactics*5-civic);}
  function damageFormula(ally,target,mult=1){let bonus=1;const h=getHero(ally.number);if(ally.row==='back')bonus*=1.15;if(ally.kind==='story')bonus*=1+(1-ally.hp/ally.maxHp)*.35;if(ally.kind==='wild'&&Object.keys(target.statuses||{}).some(k=>target.statuses[k]?.duration>0))bonus*=1.2;if(ally.kind==='stealth'&&state.current.battle.turn===1)bonus*=1.25;if(ally.kind==='water')bonus*=1+buildingLevel('waterCamp')*.025;if(ally.statuses?.power?.duration>0)bonus*=1+(ally.statuses.power.power||18)/100;bonus*=1+h.tree.power*.04;return Math.max(18,ally.atk*mult*bonus+rand(-8,18)-effectiveDef(target)*.42);}

  function applyRoleSkill(ally,target,action){
    const b=state.current.battle; let note='';
    if(ally.kind==='story'){addStatus(target,'bleed',3,18+ally.level*2);note='附加流血';}
    if(ally.kind==='justice'){addStatus(target,'armorBreak',3,1);note='附加破甲';}
    if(ally.kind==='military'){ally.shield+=110+ally.level*12;if(action==='system')b.allies.forEach(a=>{if(a.alive)a.shield+=60+ally.level*5;});note='展開軍陣護盾';}
    if(ally.kind==='transport'){ally.sp=clamp(ally.sp+34,0,ally.maxSp);b.comboGauge=clamp(b.comboGauge+18,0,100);note='疾行回氣';}
    if(ally.kind==='water'){ally.tide=(ally.tide||0)+1;if(ally.tide>=3){ally.tide=0;aliveEnemies(b).forEach(e=>applyHit(e,ally.atk*.7,{source:'潮勢浪擊'}));note='潮勢全體浪擊';}}
    if(ally.kind==='health'){const heal=80+ally.level*12;b.allies.forEach(a=>{if(a.alive){a.hp=clamp(a.hp+heal,0,a.maxHp);delete a.statuses.poison;delete a.statuses.burn;}});note=`全隊回復 ${heal}`;}
    if(ally.kind==='civic'){b.allies.forEach(a=>{if(a.alive)a.sp=clamp(a.sp+22,0,a.maxSp);});note='全隊回復豪氣';}
    if(ally.kind==='trade'){target.bonusSilver=(target.bonusSilver||0)+25+ally.level*2;note='提高戰利銀兩';}
    if(ally.kind==='wild'){addStatus(target,'poison',3,15+ally.level*2);note='附加中毒';}
    if(ally.kind==='stealth'&&Math.random()<ally.statusChance+.18){addStatus(target,'stun',1,1);note='使目標暈眩';}
    return note;
  }

  function performCombo(){
    const b=state.current.battle; const bond=activeBonds().find(x=>x.name===b.activeBond)||activeBonds()[0]; if(!bond||b.comboGauge<100)return false;
    b.comboGauge=0; const party=aliveAllies(b); const avgAtk=party.reduce((s,a)=>s+a.atk,0)/Math.max(1,party.length); let mult=1.25;
    if(bond.status==='boss'&&aliveEnemies(b).some(e=>e.type==='boss'))mult=1.65;if(bond.status==='desperate'&&party.some(a=>a.hp<a.maxHp*.45))mult=1.85;
    aliveEnemies(b).forEach(e=>{applyHit(e,avgAtk*mult,{pierce:true,crit:bond.status==='crit',source:bond.name});if(['burn','bleed','armorBreak','stun'].includes(bond.status))addStatus(e,bond.status,bond.status==='stun'?1:3,28);if(bond.status==='slow')e.atk=Math.max(12,Math.round(e.atk*.82));});
    if(bond.status==='shield')party.forEach(a=>{a.shield+=180;a.sp=clamp(a.sp+80,0,a.maxSp);});
    if(bond.status==='power')party.forEach(a=>addStatus(a,'power',3,18));
    if(bond.status==='heal'){party.forEach(a=>a.hp=clamp(a.hp+220,0,a.maxHp));state.current.medicines=Math.min(5,state.current.medicines+1);}
    state.current.stats.combos++; b.log.unshift(`發動羈絆合擊「${bond.name}」：${bond.text}`); tone('achievement'); return true;
  }

  function tickDamageStatuses(entity){
    if(!entity.alive)return; for(const key of ['poison','burn','bleed']){const s=entity.statuses?.[key];if(s?.duration>0){const dmg=Math.round(s.power);entity.hp=Math.max(0,entity.hp-dmg);s.duration--;state.current.battle.log.unshift(`${entity.name}受到${statusLabel(key)} ${dmg} 點傷害。`);if(s.duration<=0)delete entity.statuses[key];if(entity.hp<=0){entity.alive=false;state.current.battle.log.unshift(`${entity.name}因持續傷害倒下。`);}}}
    const power=entity.statuses?.power;if(power?.duration>0){power.duration--;if(power.duration<=0)delete entity.statuses.power;}
    const broken=entity.statuses?.armorBreak;if(broken?.duration>0){broken.duration--;if(broken.duration<=0)delete entity.statuses.armorBreak;}
  }

  function checkBossPhases(){
    const b=state.current.battle; const boss=b.enemies.find(e=>e.type==='boss'&&e.alive);if(!boss)return;
    const ratio=boss.hp/boss.maxHp;const next=ratio<=.35?3:ratio<=.70?2:1;if(next<=boss.phase)return;boss.phase=next;
    b.log.unshift(`首領進入第 ${next} 階段！`);
    if(next===2){boss.atk=Math.round(boss.atk*1.18);boss.def+=6;if(boss.mechanic.key==='reinforce')b.enemies.push(makeEnemy(currentChapter(),2,b.enemies.length,b.difficulty));if(boss.mechanic.key==='armor')boss.shield+=Math.round(boss.maxHp*.15);}
    if(next===3){boss.atk=Math.round(boss.atk*1.22);boss.def+=8;if(boss.mechanic.key==='regen'){boss.hp=clamp(boss.hp+Math.round(boss.maxHp*.12),0,boss.maxHp);boss.statuses={};}if(boss.mechanic.key==='poison')aliveAllies(b).forEach(a=>addStatus(a,'poison',3,32));}
  }

  function chooseEnemyTarget(enemy,b){
    const alive=aliveAllies(b);const taunter=alive.find(a=>a.statuses?.taunt?.duration>0);if(taunter)return taunter;
    const front=alive.filter(a=>a.row==='front');if(front.length&&Math.random()<.75)return front[rand(0,front.length-1)];return alive[rand(0,alive.length-1)];
  }

  function enemyPhase(){
    const b=state.current.battle; if(!b)return;
    checkBossPhases();
    for(const enemy of aliveEnemies(b)){
      tickDamageStatuses(enemy);if(!enemy.alive)continue;
      const stun=enemy.statuses?.stun;if(stun?.duration>0){stun.duration--;if(stun.duration<=0)delete enemy.statuses.stun;b.log.unshift(`${enemy.name}暈眩，無法行動。`);continue;}
      if(enemy.type==='boss'&&enemy.mechanic?.key==='regen'&&b.turn%3===0){const heal=Math.round(enemy.maxHp*(enemy.phase===3?.09:.055));enemy.hp=clamp(enemy.hp+heal,0,enemy.maxHp);b.log.unshift(`${enemy.name}回生 ${heal} 氣血。`);}
      const target=chooseEnemyTarget(enemy,b);if(!target)break;
      let mult=1;if(target.row==='front')mult*=.82;if(target.guarding)mult*=.45;if(enemy.type==='caster'&&target.row==='back')mult*=1.18;if(enemy.type==='boss'&&enemy.phase===3)mult*=1.18;
      let damage=Math.max(12,enemy.atk*mult+rand(-7,14)-target.def*.36);if(target.statuses?.power?.duration>0)damage*=.92;
      if(target.shield>0){const absorbed=Math.min(target.shield,Math.round(damage));target.shield-=absorbed;damage-=absorbed;if(absorbed)b.log.unshift(`${target.name}護盾吸收 ${absorbed} 傷害。`);}
      damage=Math.max(0,Math.round(damage));target.hp=Math.max(0,target.hp-damage);b.log.unshift(`${enemy.name}攻擊${target.name}，造成 ${damage} 傷害。`);
      if(enemy.type==='boss'&&enemy.mechanic?.key==='poison')addStatus(target,'poison',3,enemy.phase===3?32:22);
      if(enemy.type==='caster'&&Math.random()<.28)addStatus(target,'burn',2,18);
      if(target.hp<=0){target.alive=false;b.log.unshift(`${target.name}重傷退陣。`);}
      if(enemy.type==='boss'&&enemy.mechanic?.key==='counter'&&enemy.phase===3&&aliveAllies(b).length){const extra=aliveAllies(b)[0];extra.hp=Math.max(0,extra.hp-22);}
    }
    aliveAllies(b).forEach(a=>{tickDamageStatuses(a);a.guarding=false;const t=a.statuses?.taunt;if(t?.duration>0){t.duration--;if(t.duration<=0)delete a.statuses.taunt;}});
  }

  function advanceActive(){const b=state.current.battle;if(!b)return;b.activeIndex=(b.activeIndex+1)%b.allies.length;activeAlly(b);}

  function battleAction(action){
    if(battleBusy||!state.current?.battle)return; battleBusy=true;clearAutoTimer();const run=state.current;const b=run.battle;const ally=activeAlly(b);const target=selectedEnemy(b);if(!ally||!target){battleBusy=false;return;}
    let acted=false;let damage=0;let label='';let note='';let crit=false;ally.guarding=false;
    const skill=skillCost(ally,'skill'),system=skillCost(ally,'system');
    if(action==='attack'){acted=true;label=`${ally.nickname}進擊`;damage=damageFormula(ally,target,1);}
    if(action==='skill'&&ally.sp>=skill){acted=true;ally.sp-=skill;label=passiveFor(ally.number).unique;damage=damageFormula(ally,target,1.65);note=applyRoleSkill(ally,target,'skill');}
    if(action==='system'&&ally.sp>=system){acted=true;ally.sp-=system;label=`${chapter(ally.number).title.split('・')[1]||'聚義絕技'}`;const targets=aliveEnemies(b);targets.forEach(e=>{const c=Math.random()<ally.crit+.08;applyHit(e,damageFormula(ally,e,1.25),{pierce:ally.kind==='justice',crit:c,source:label});});note=applyRoleSkill(ally,target,'system');damage=0;}
    if(action==='guard'){acted=true;ally.guarding=true;ally.sp=clamp(ally.sp+48,0,ally.maxSp);ally.shield+=55+buildingLevel('infirmary')*8;if(ally.kind==='military'){ally.statuses.taunt={duration:1,power:1};b.allies.forEach(a=>{if(a.alive)a.shield+=40;});}label='守勢回氣';note='回復豪氣並提高防禦';}
    if(action==='medicine'&&run.medicines>0){acted=true;run.medicines--;run.stats.medicinesUsed++;const heal=260+buildingLevel('infirmary')*45;ally.hp=clamp(ally.hp+heal,0,ally.maxHp);delete ally.statuses.poison;delete ally.statuses.burn;label='使用金瘡藥';note=`回復 ${heal} 氣血`;}
    if(action==='combo'){acted=performCombo();label='聚義合擊';}
    if(!acted){battleBusy=false;queueAuto();return;}
    if(damage>0){crit=Math.random()<ally.crit; if(crit)damage*=1.55;const dealt=applyHit(target,damage,{pierce:ally.kind==='justice',crit,source:label});b.log.unshift(`${ally.name}施展「${label}」，對${target.name}造成 ${dealt} 傷害${note?`，${note}`:''}。`);}
    else if(action!=='combo')b.log.unshift(`${ally.name}施展「${label}」${note?`，${note}`:''}。`);
    b.comboGauge=clamp(b.comboGauge+(ally.kind==='transport'?28:18),0,100);b.turn++;run.stats.actions++;
    if(aliveEnemies(b).length===0){battleVictory();battleBusy=false;return;}
    const livingBoss=b.enemies.find(e=>e.type==='boss'&&e.alive&&e.mechanic?.key==='counter');
    if(livingBoss&&['skill','system'].includes(action)){
      const reflected=Math.round((22+livingBoss.atk*.24)*(livingBoss.phase===3?1.6:1));
      ally.hp=Math.max(0,ally.hp-reflected);b.log.unshift(`${livingBoss.name}發動借力反震，${ally.name}受到 ${reflected} 傷害。`);
      if(ally.hp<=0){ally.alive=false;b.log.unshift(`${ally.name}遭反震重傷退陣。`);}
    }
    if(aliveAllies(b).length===0){handleDefeat();battleBusy=false;return;}
    enemyPhase();
    if(aliveAllies(b).length===0){handleDefeat();battleBusy=false;return;}
    if(aliveEnemies(b).length===0){battleVictory();battleBusy=false;return;}
    advanceActive();save(true);renderBattle();battleBusy=false;queueAuto();
  }

  function smartAction(){
    const b=state.current?.battle;if(!b)return;const ally=activeAlly(b);if(!ally)return;
    if(b.comboGauge>=100&&b.activeBond)return battleAction('combo');
    if(ally.hp<ally.maxHp*.30&&state.current.medicines>0)return battleAction('medicine');
    const sys=skillCost(ally,'system'),sk=skillCost(ally,'skill');if(ally.sp>=sys&&aliveEnemies(b).length>1)return battleAction('system');if(ally.sp>=sk)return battleAction('skill');if(ally.hp<ally.maxHp*.48)return battleAction('guard');return battleAction('attack');
  }

  function clearAutoTimer(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}}
  function queueAuto(){clearAutoTimer();const b=state.current?.battle;if(!b||!b.auto)return;const stableBoost=1+(buildingLevel('stable')-1)*.08;const delay=Math.round(900/(Math.max(1,b.speed||1)*stableBoost));autoTimer=setTimeout(()=>{if(state.current?.battle?.auto)smartAction();},delay);}
  function setBattleSpeed(speed){const s=clamp(Number(speed)||1,1,3);prefs.battleSpeed=s;if(state.current?.battle)state.current.battle.speed=s;save(true);renderBattle();queueAuto();}
  function toggleAuto(){prefs.autoBattle=!prefs.autoBattle;if(state.current?.battle)state.current.battle.auto=prefs.autoBattle;save(true);renderBattle();queueAuto();}

  function battleVictory(){
    clearAutoTimer();const run=state.current;const b=run.battle;const stage=b.stage;const ch=currentChapter();const d=DIFFICULTIES[b.difficulty];
    const base=[120,190,310][stage]+ch.number*3;const tradeBonus=b.allies.filter(a=>a.kind==='trade').length*20;const bonus=b.enemies.reduce((s,e)=>s+Number(e.bonusSilver||0),0);const reward=Math.round((base+tradeBonus+bonus)*d.reward);
    const xp=Math.round(([70,110,180][stage]+ch.number)*d.xp*(1+buildingLevel('hall')*.04));const materialReward={iron:stage===2?5:2,wood:stage===1?4:2,cloth:stage===0?3:2,essence:stage===2?2:0};
    run.battles[String(stage)]=true;run.silverEarned+=reward;state.silver+=reward;Object.entries(materialReward).forEach(([k,v])=>state.inventory.materials[k]+=v);
    b.allies.forEach(a=>{getHero(a.number).wins++;const levels=grantXp(a.number,xp);if(levels.length)run.log.unshift(`${a.name}升至 ${levels.at(-1)} 級，獲得技能點。`);});
    run.medicines=Math.min(5,run.medicines+1);run.log.unshift(`第 ${stage+1} 場勝利：獲得 ${reward} 銀兩、每位英雄 ${xp} 經驗。`);run.battle=null;screen='chapter';save(true);toast(`戰鬥勝利，獲得 ${reward} 銀兩與養成素材。`,'good');tone('victory');render();
  }

  function handleDefeat(){clearAutoTimer();const run=state.current;run.stats.defeats++;run.battle=null;screen='chapter';save(true);toast('隊伍失利，已退回戰前；章回進度完整保留。','warn');render();}

  function computeResult(run){let score=100;score-=Math.max(0,run.stats.actions-25);score-=run.stats.defeats*12;score-=run.stats.medicinesUsed*4;score+=Math.min(5,run.stats.combos*2);score=clamp(Math.round(score),40,100);const grade=score>=90?'S':score>=78?'A':score>=65?'B':'C';const achievements=[];if(run.clues.length===4)achievements.push('明察四證');if(run.stats.defeats===0)achievements.push('三戰連捷');if(run.stats.medicinesUsed===0)achievements.push('無藥制勝');if(run.stats.combos>0)achievements.push('聚義合擊');return{score,grade,achievements};}
  function finishChapter(){
    const run=state.current;if(!run||!canPerform(run,'finish',0)||!run.battles['2'])return;const result=computeResult(run);const ch=currentChapter();run.complete=true;run.score=result.score;run.grade=result.grade;run.achievements=result.achievements;
    const reward=220+ch.number*4;state.silver+=reward;run.silverEarned+=reward;state.inventory.materials.essence+=result.grade==='S'?3:1;
    const previous=state.completed[String(ch.number)];const record={grade:result.grade,score:result.score,actions:run.stats.actions,defeats:run.stats.defeats,medicinesUsed:run.stats.medicinesUsed,combos:run.stats.combos,achievements:result.achievements,completedAt:new Date().toISOString(),source:`v${VERSION} ${EDITION}`};if(!previous||Number(previous.score||0)<=result.score)state.completed[String(ch.number)]=record;
    state.unlocked=Math.max(state.unlocked,Math.min(108,ch.number+1));state.selected=Math.min(108,ch.number+1);repairFormation();state.runs[String(ch.number)]=run;screen='ending';save(true);render();tone('achievement');
  }

  function craftCost(type){const lv=buildingLevel('smithy');return type==='weapon'?{silver:220+lv*55,iron:8+lv*2,wood:3}:{silver:210+lv*50,iron:5+lv,cloth:7+lv*2};}
  function rollRarity(){const smithy=buildingLevel('smithy');const r=Math.random()*100;const epic=RARITIES.epic.weight+smithy*2;const rare=RARITIES.rare.weight+smithy*3;return r<epic?'epic':r<epic+rare?'rare':'common';}
  function craftItem(type){
    if(!ITEM_TEMPLATES[type])return;const cost=craftCost(type);if(state.silver<cost.silver)return toast('銀兩不足。','warn');for(const [k,v]of Object.entries(cost))if(k!=='silver'&&(state.inventory.materials[k]||0)<v)return toast(`${k==='iron'?'鐵礦':k==='wood'?'木材':'布料'}不足。`,'warn');
    state.silver-=cost.silver;Object.entries(cost).forEach(([k,v])=>{if(k!=='silver')state.inventory.materials[k]-=v;});const template=ITEM_TEMPLATES[type][rand(0,ITEM_TEMPLATES[type].length-1)];const rarity=rollRarity();const id=`v72-${Date.now()}-${state.inventory.nextItemId++}`;const stats={};Object.entries(template).forEach(([k,v])=>{if(['name','icon'].includes(k))return;if(typeof v==='number')stats[k]=v;});state.inventory.items.push({id,type,name:template.name,icon:template.icon,rarity,level:1,stats,createdAt:new Date().toISOString(),equippedBy:null});save(true);renderForge();toast(`鍛造完成：${RARITIES[rarity].name}${template.name}。`,'good');tone('achievement');
  }
  function upgradeItem(id){const item=getItem(id);if(!item)return;if(item.level>=5)return toast('裝備已達 5 級。','warn');const cost=160*item.level;const essence=item.level>=3?1:0;if(state.silver<cost||state.inventory.materials.essence<essence)return toast('銀兩或精華不足。','warn');state.silver-=cost;state.inventory.materials.essence-=essence;item.level++;save(true);renderForge();toast(`${item.name}已強化至 +${item.level}。`,'good');}
  function dismantleItem(id){const item=getItem(id);if(!item)return;if(item.equippedBy)return toast('已裝備的物品無法分解。','warn');if(state.inventory.items.length<=2)return toast('至少保留兩件裝備。','warn');const mult=item.rarity==='epic'?3:item.rarity==='rare'?2:1;state.inventory.materials[item.type==='weapon'?'iron':'cloth']+=3*mult+item.level;state.inventory.materials.essence+=item.rarity==='epic'?2:item.rarity==='rare'?1:0;state.inventory.items=state.inventory.items.filter(x=>x.id!==id);save(true);renderForge();toast(`${item.name}已分解為素材。`,'good');}

  function buildingCost(key){const level=buildingLevel(key);const material=BUILDINGS[key].material;return{silver:400+level*320,material,amount:10+level*7,essence:level>=3?level-2:0};}
  function upgradeBuilding(key){const b=BUILDINGS[key];if(!b)return;const level=buildingLevel(key);if(level>=5)return toast('建築已達最高 5 級。','good');const c=buildingCost(key);if(state.silver<c.silver||(state.inventory.materials[c.material]||0)<c.amount||state.inventory.materials.essence<c.essence)return toast('升級資源不足。','warn');state.silver-=c.silver;state.inventory.materials[c.material]-=c.amount;state.inventory.materials.essence-=c.essence;state.base[key]=level+1;save(true);renderBase();toast(`${b.name}升至 ${level+1} 級。`,'good');tone('achievement');}

  function buyMedicine(){const cost=Math.max(70,130-buildingLevel('infirmary')*10);if(state.silver<cost)return toast('銀兩不足。','warn');if(state.inventory.medicines>=99)return toast('備用藥品已達上限。','warn');state.silver-=cost;state.inventory.medicines++;save(true);renderForge();toast('已購買一份備用金瘡藥。','good');}

  function topbar(subtitle=''){return `<header class="topbar"><div class="brand"><div class="brand-mark">梁</div><div class="brand-text"><b>水滸英雄傳：梁山風雲</b><small>v${VERSION} ${EDITION}${subtitle?`・${esc(subtitle)}`:''}</small></div></div><div class="top-actions"><button class="btn icon" data-act="theme" title="切換顯示模式">◐</button><button class="btn icon" data-act="speech" title="朗讀本頁">朗</button><button class="btn icon" data-act="manage" title="存檔管理">存</button></div></header>`;}

  function renderChapters(){
    screen='chapters';clearAutoTimer();const q=chapterSearch.trim().toLowerCase();const first=firstIncomplete();const recentSet=new Set(state.recent);const list=chapters.filter(ch=>{if(chapterEra!=='all'&&ch.era!==chapterEra)return false;if(q&&!`${ch.number}${ch.name}${ch.nickname}${ch.title}${ch.focus}`.toLowerCase().includes(q))return false;const rec=state.completed[String(ch.number)];if(chapterStatus==='unfinished'&&rec)return false;if(chapterStatus==='non-s'&&rec?.grade==='S')return false;if(chapterStatus==='recent'&&!recentSet.has(ch.number))return false;return true;});

  function flowItem(run,ch,step,pos){const done=stepDone(run,step);const current=currentStepIndex(run)===pos;let title='',text='',button='';if(step.type==='clue'){const d=clueData(ch)[step.index];title=d.title;text=d.text;button=`<button class="btn" data-clue="${step.index}" ${!current||done?'disabled':''}>${done?'已查驗':'查驗'}</button>`;}if(step.type==='strategy'){const d=strategyData(ch)[step.index];title=d.title;text=d.text;button=`<button class="btn" data-strategy="${step.index}" ${!current||done?'disabled':''}>${done?'已完成':'定策'}</button>`;}if(step.type==='battle'){title=['前哨多敵戰','查驗混戰','三階段首領戰'][step.index];text=['兩名敵人同時來襲，熟悉選取目標與前後排。','三名敵人分工作戰，注意術士與持續狀態。','首領帶領親兵出戰，將在 70% 與 35% 氣血轉換階段。'][step.index];button=`<button class="btn ${step.index===2?'danger':'primary'}" data-battle-start="${step.index}" ${!current||done?'disabled':''}>${done?'已勝利':'迎戰'}</button>`;}if(step.type==='finish'){title='章回結算';text='計算評級、成就、經驗、銀兩與建設素材。';button=`<button class="btn good" data-act="finish" ${!current||done?'disabled':''}>完成本回</button>`;}return `<article class="flow-step ${done?'done':current?'current':'locked'}"><div class="flow-index">${done?'✓':pos+1}</div><div><h3>${esc(step.phase)}・${esc(title)}</h3><p>${esc(text)}</p></div>${button}</article>`;}

  function renderChapter(){

n,ch,s,i)).join('')}</div></section>`;

  function toast(message,type=''){const node=document.createElement('div');node.className=`toast ${type}`;node.textContent=message;toastRoot.appendChild(node);setTimeout(()=>node.remove(),2600);}
  function tone(type){if(!prefs.sound)return;try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain();o.frequency.value=({hit:180,hurt:105,skill:410,guard:280,save:340,battle:145,victory:600,achievement:760}[type]||300);g.gain.setValueAtTime(.035,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.14);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.15);}catch{}}
  function speakPage(){if(!('speechSynthesis'in window))return toast('此瀏覽器不支援語音朗讀。','warn');speechSynthesis.cancel();const text=app.innerText.slice(0,5000);const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.95;speechSynthesis.speak(u);toast('開始朗讀本頁。','good');}
  function cycleTheme(){const order=['ink','dark','paper'];prefs.theme=order[(order.indexOf(prefs.theme)+1)%order.length];save(true);render();}
  function downloadText(filename,text,mime='application/json'){const blob=new Blob([text],{type:`${mime};charset=utf-8`});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function importSaveText(text){const parsed=JSON.parse(text);const incoming=parsed?.state||parsed;if(!incoming||typeof incoming!=='object'||!incoming.completed)throw new Error('invalid');storage.setItem(`${BACKUP_PREFIX}before-import`,JSON.stringify(state));state=mergeState(incoming);if(parsed?.prefs)prefs={...freshPrefs(),...parsed.prefs};save(true);}

  function showUpdateAvailable(registration){swRegistration=registration;updateRoot.innerHTML=`<aside class="update-banner"><div><b>發現新版遊戲</b><small>更新前會先保存養成、裝備、隊伍與章回進度。</small></div><div class="actions"><button class="btn small" data-act="release-notes">更新內容</button><button class="btn small primary" data-act="apply-update">立即更新</button><button class="btn small" data-act="dismiss-update">稍後</button></div></aside>`;}
  function registerServiceWorker(){if(!('serviceWorker'in navigator)||location.protocol==='file:')return;navigator.serviceWorker.register('service-worker.js').then(reg=>{swRegistration=reg;if(reg.waiting)showUpdateAvailable(reg);reg.addEventListener('updatefound',()=>{const w=reg.installing;w?.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdateAvailable(reg);});});reg.update().catch(()=>{});}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload();});}

  app.addEventListener('click',event=>{
    const chapterButton=event.target.closest('[data-chapter]');if(chapterButton){openChapterChoice(chapterButton.dataset.chapter);return;}
    const clue=event.target.closest('[data-clue]');if(clue){collectClue(clue.dataset.clue);return;}
    const strategy=event.target.closest('[data-strategy]');if(strategy){doStrategy(strategy.dataset.strategy);return;}
    const start=event.target.closest('[data-battle-start]');if(start){startBattle(start.dataset.battleStart);return;}
    const action=event.target.closest('[data-battle-action]');if(action){battleAction(action.dataset.battleAction);return;}
    const target=event.target.closest('[data-target]');if(target&&state.current?.battle){state.current.battle.targetIndex=Number(target.dataset.target);save(true);renderBattle();return;}
    const speed=event.target.closest('[data-speed]');if(speed){setBattleSpeed(speed.dataset.speed);return;}
    const skill=event.target.closest('[data-skill]');if(skill){allocateSkill(Number(skill.dataset.hero),skill.dataset.skill);return;}
    const best=event.target.closest('[data-equip-best]');if(best){equipBest(Number(best.dataset.equipBest));return;}
    const craft=event.target.closest('[data-craft]');if(craft){craftItem(craft.dataset.craft);return;}
    const upItem=event.target.closest('[data-upgrade-item]');if(upItem){upgradeItem(upItem.dataset.upgradeItem);return;}
    const dismantle=event.target.closest('[data-dismantle]');if(dismantle){dismantleItem(dismantle.dataset.dismantle);return;}
    const building=event.target.closest('[data-building]');if(building){upgradeBuilding(building.dataset.building);return;}
    const diff=event.target.closest('[data-difficulty]');if(diff&&state.current&&!state.current.battle){state.current.difficulty=diff.dataset.difficulty;prefs.difficulty=diff.dataset.difficulty;save(true);renderChapter();return;}
    const btn=event.target.closest('[data-act]');if(!btn)return;const act=btn.dataset.act;
    if(act==='home'){screen='home';render();}if(act==='chapters'){screen='chapters';render();}if(act==='team'){screen='team';render();}if(act==='heroes'){screen='heroes';render();}if(act==='forge'){screen='forge';render();}if(act==='base'){screen='base';render();}
    if(act==='continue'){if(state.current){screen=state.current.battle?'battle':state.current.complete?'ending':'chapter';render();}else openChapterChoice(firstIncomplete());}
    if(act==='clear-filter'){chapterSearch='';chapterEra='all';chapterStatus='all';renderChapters();}
    if(act==='finish')finishChapter();if(act==='next')startChapter(Math.min(108,currentChapter().number+1),false);
    if(act==='replay'||act==='restart-current'){const n=currentChapter().number;openModal('重新挑戰確認',`<p>確定重新開始第 ${n} 回嗎？最佳完成紀錄、英雄等級、裝備與建設均會保留。</p><div class="actions"><button class="btn danger" data-modal="chapter-restart" data-number="${n}">確定重新挑戰</button><button class="btn" data-modal="close">取消</button></div>`);}
    if(act==='claim-medicine')claimMedicine();if(act==='buy-medicine')buyMedicine();if(act==='toggle-auto')toggleAuto();if(act==='theme')cycleTheme();if(act==='speech')speakPage();if(act==='manage')openManage();if(act==='release-notes')openReleaseNotes();if(act==='dismiss-update')updateRoot.innerHTML='';if(act==='apply-update'&&swRegistration?.waiting){save(true);swRegistration.waiting.postMessage({type:'SKIP_WAITING'});}if(act==='install'&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>deferredPrompt=null);}
  });

  app.addEventListener('change',event=>{const select=event.target.closest('[data-formation]');if(select)setFormation(select.dataset.formation,select.value);});

  modalRoot.addEventListener('click',event=>{
    const backdrop=event.target.closest('[data-backdrop-close]');if(backdrop&&event.target===backdrop){closeModal();return;}const button=event.target.closest('[data-modal]');if(!button)return;const act=button.dataset.modal;if(act==='close'){closeModal();return;}
    if(['chapter-resume','chapter-restart','chapter-switch'].includes(act)){const n=Number(button.dataset.number);closeModal();startChapter(n,act==='chapter-restart');return;}
    const textarea=$('#saveText');if(act==='copy'&&textarea)navigator.clipboard?.writeText(textarea.value).then(()=>toast('存檔已複製。','good')).catch(()=>{});if(act==='download'&&textarea)downloadText(`Liangshan_v${VERSION}_save_${new Date().toISOString().slice(0,10)}.json`,textarea.value);
    if(act==='import'&&textarea){try{importSaveText(textarea.value);closeModal();screen='home';render();toast('存檔匯入成功。','good');}catch{toast('存檔格式不正確。','warn');}}
    if(act==='reset-all'&&confirm('確定清除 v7 全部章回、英雄、裝備與建設進度嗎？')){storage.removeItem(SAVE_KEY);state=mergeState(freshState());closeModal();screen='home';save(true);render();toast('全部進度已重設。','warn');}
  });

  window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredPrompt=event;});
  document.body.dataset.theme=prefs.theme;save(true);render();registerServiceWorker();

  window.__LIANGSHAN_TEST__={
    version:VERSION,chapters,flow:FLOW,getState:()=>clone(state),getPrefs:()=>clone(prefs),
    start:(n,force=true)=>startChapter(n,force),
    completeCurrentStep:()=>{const run=state.current;if(!run)return;const step=FLOW[currentStepIndex(run)];if(step.type==='clue')collectClue(step.index);else if(step.type==='strategy')doStrategy(step.index);else if(step.type==='battle'){run.battles[String(step.index)]=true;save(true);renderChapter();}else finishChapter();},
    autoComplete:n=>{startChapter(n,true);const r=state.current;r.clues=[0,1,2,3];r.strategies=[0,1,2,3,4];r.battles={0:true,1:true,2:true};finishChapter();},
    setSilver:v=>{state.silver=Math.max(0,Number(v)||0);save(true);render();},
    setMaterials:v=>{state.inventory.materials={...state.inventory.materials,...v};save(true);render();},
    formation:()=>clone(state.formation),setFormation,
    activeBonds:()=>clone(activeBonds()),heroStats:n=>clone(heroCombatStats(Number(n),'front')),mergePreview:raw=>clone(mergeState(raw)),
    allocateSkill,grantXp,equipBest,craftItem,upgradeItem,dismantleItem,upgradeBuilding,passiveFor:n=>clone(passiveFor(Number(n))),bonds:clone(BONDS),buildings:clone(BUILDINGS),
    prepareBattle:(n,stage=2)=>{startChapter(n,true);const r=state.current;if(stage>0){r.clues=[0,1,2,3];r.strategies=[0,1,2,3,4];r.battles={0:true,1:stage>1,2:false};}startBattle(stage);},
    startBattle,battleAction,smartAction,simulateUpdate:()=>showUpdateAvailable({waiting:{postMessage:()=>{}}}),
    reset:()=>{storage.removeItem(SAVE_KEY);state=mergeState(freshState());save(true);screen='home';render();}
  };
})();
</script>
</body>
</html>
