<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梁山 v7.9.2 一鍵更新與資料驗證</title><link rel="stylesheet" href="styles.css"><script defer src="chapters.js"></script><script defer src="modules/epic-chapters.js"></script><script defer src="modules/epic-chapters-v76.js"></script><script defer src="modules/epic-chapters-v77.js"></script><script defer src="modules/epic-chapters-v78.js"></script><script defer src="modules/stability-v79.js"></script><script defer src="modules/validation-v792.js"></script></head>
<body><main class="update-check-page"><section class="hero"><span class="eyebrow">UPDATE DOCTOR v7.9.2</span><h1>梁山 v7.9.2 一鍵更新、資料驗證與快取檢查</h1><p>此頁會檢查更新包是否覆蓋完整、108 回章回資料格式、判斷題顯示、Service Worker 快取版本與存檔安全。它不會直接修改你的主存檔；執行修復前會要求你先備份。</p><div class="actions"><button class="btn primary" id="runCheck">開始完整檢查</button><button class="btn" id="clearCache">清除梁山快取</button><button class="btn" id="exportReport">匯出檢查報告</button><a class="btn" href="index.html">返回遊戲</a></div></section><section id="results" class="card"><p>按「開始完整檢查」後顯示結果。</p></section><section class="card"><h2>更新失敗時</h2><ol><li>先關閉所有遊戲頁面。</li><li>使用 v7.9.2 完整包覆蓋，或使用 rollback 包回復到 v7.9.1。</li><li>重新開啟本頁並按「清除梁山快取」。</li><li>再次開啟 `index.html`，確認首頁版本為 v7.9.2。</li></ol></section></main><script>
const VERSION='7.9.2';let lastReport=null;
const files=['index.html','game.js','styles.css','manifest.webmanifest','service-worker.js','update.html','modules/stability-v79.js','modules/chain-v79.js','modules/season-v79.js','modules/validation-v792.js'];
async function exists(f){try{const r=await fetch(f,{cache:'no-store'});return {name:f,ok:r.ok,detail:'HTTP '+r.status};}catch(e){return {name:f,ok:false,detail:e.message};}}
function card(x){return `<article class="update-check-card ${x.ok?'ok':'bad'}"><b>${x.ok?'✓':'!'} ${x.name}</b><p>${x.detail||''}</p></article>`}
async function swVersion(){if(!('serviceWorker'in navigator))return {name:'Service Worker 版本',ok:false,detail:'不支援'};try{const reg=await navigator.serviceWorker.getRegistration('./');if(!reg)return {name:'Service Worker 版本',ok:false,detail:'尚未註冊'};reg.update().catch(()=>{});return {name:'Service Worker 版本',ok:true,detail:'已註冊；請回首頁完成接管後重新檢查快取版本'};}catch(e){return {name:'Service Worker 版本',ok:false,detail:e.message};}}
async function run(){const rows=[];rows.push({name:'目前頁面版本',ok:document.title.includes(VERSION),detail:document.title});rows.push({name:'安全來源',ok:location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1',detail:location.href});rows.push({name:'Service Worker API',ok:'serviceWorker'in navigator,detail:'navigator.serviceWorker'});rows.push({name:'Cache Storage',ok:'caches'in window,detail:'快取清除與版本診斷'});rows.push({name:'IndexedDB',ok:'indexedDB'in window,detail:'本機主存檔'});for(const f of files)rows.push(await exists(f));rows.push(await swVersion());
 const data=window.LS792Validation?.validateAll?.(window.LIANGSHAN_CHAPTERS||[])||{passed:0,total:1,ok:false,failures:[{chapter:'?',name:'資料驗證模組',detail:'未載入'}]};
 const display=window.LS792Validation?.displayTest?.(window.LIANGSHAN_CHAPTERS||[])||{passed:0,total:1,ok:false,rows:[]};
 const visible=window.LS792Validation?.scanText?.(document)||{passed:0,total:1,ok:false,matches:[]};
 rows.push({name:'108 回資料格式驗證',ok:data.ok,detail:`${data.passed}/${data.total}・失敗 ${data.failures?.length||0}`});rows.push({name:'108 回判斷題顯示測試',ok:display.ok,detail:`${display.passed}/${display.total}`});rows.push({name:'目前畫面異常文字掃描',ok:visible.ok,detail:visible.ok?'沒有 undefined / [object Object]':`${visible.matches.length} 筆`});
 lastReport={version:VERSION,at:new Date().toISOString(),rows,dataSummary:{passed:data.passed,total:data.total,failures:(data.failures||[]).slice(0,30)},displaySummary:{passed:display.passed,total:display.total,failures:(display.rows||[]).filter(x=>!x.ok).slice(0,30)},visible};
 document.querySelector('#results').innerHTML=`<h2>檢查結果 ${rows.filter(x=>x.ok).length}/${rows.length}</h2><div class="status-grid">${rows.map(card).join('')}</div><h3>資料格式問題前 30 筆</h3><textarea class="field" rows="8" readonly>${JSON.stringify(lastReport.dataSummary.failures,null,2)}</textarea><h3>完整檢查報告</h3><textarea class="field" rows="10" readonly>${JSON.stringify(lastReport,null,2)}</textarea>`;}
async function clearCache(){if(!('caches'in window)){alert('此瀏覽器不支援 Cache Storage');return;}const names=await caches.keys();const targets=names.filter(x=>x.toLowerCase().includes('liangshan'));await Promise.all(targets.map(x=>caches.delete(x)));localStorage.setItem('liangshan-v792-cache-version',VERSION);alert('已清除 '+targets.length+' 個梁山快取，請重新開啟遊戲。');}
function exportReport(){if(!lastReport)run().then(exportReport);else{const blob=new Blob([JSON.stringify(lastReport,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Liangshan_v7.9.2_update_validation_report.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}}
document.querySelector('#runCheck').addEventListener('click',run);document.querySelector('#clearCache').addEventListener('click',clearCache);document.querySelector('#exportReport').addEventListener('click',exportReport);window.addEventListener('load',run);
</script></body></html>
