<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梁山 v7.9.0 一鍵更新檢查</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="update-check-page"><section class="hero"><span class="eyebrow">UPDATE DOCTOR</span><h1>梁山 v7.9.0 一鍵更新檢查頁</h1><p>此頁會檢查更新包是否覆蓋完整、Service Worker 是否仍快取舊版、必要 v7.9 模組是否存在。它不會修改你的存檔。</p><div class="actions"><button class="btn primary" id="runCheck">開始檢查</button><button class="btn" id="clearCache">清除梁山快取</button><a class="btn" href="index.html">返回遊戲</a></div></section><section id="results" class="card"><p>按「開始檢查」後顯示結果。</p></section><section class="card"><h2>更新失敗時</h2><ol><li>先關閉所有遊戲頁面。</li><li>使用 rollback 包覆蓋回 v7.8.0。</li><li>重新開啟本頁並按「清除梁山快取」。</li><li>再次覆蓋 v7.9.0 更新包。</li></ol></section></main><script>
const files=['index.html','game.js','styles.css','manifest.webmanifest','service-worker.js','modules/stability-v79.js','modules/chain-v79.js','modules/season-v79.js'];
async function exists(f){try{const r=await fetch(f,{cache:'no-store'});return {name:f,ok:r.ok,detail:'HTTP '+r.status};}catch(e){return {name:f,ok:false,detail:e.message};}}
function card(x){return `<article class="update-check-card ${x.ok?'ok':'bad'}"><b>${x.ok?'✓':'!'} ${x.name}</b><p>${x.detail||''}</p></article>`}
async function run(){const rows=[];rows.push({name:'安全來源',ok:location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1',detail:location.href});rows.push({name:'Service Worker API',ok:'serviceWorker'in navigator,detail:'navigator.serviceWorker'});rows.push({name:'IndexedDB',ok:'indexedDB'in window,detail:'本機主存檔'});for(const f of files)rows.push(await exists(f));document.querySelector('#results').innerHTML=`<h2>檢查結果 ${rows.filter(x=>x.ok).length}/${rows.length}</h2><div class="status-grid">${rows.map(card).join('')}</div><textarea class="field" rows="8" readonly>${JSON.stringify({version:'7.9.0',at:new Date().toISOString(),rows},null,2)}</textarea>`;}
async function clearCache(){if(!('caches'in window)){alert('此瀏覽器不支援 Cache Storage');return;}const names=await caches.keys();await Promise.all(names.filter(x=>x.includes('liangshan')).map(x=>caches.delete(x)));localStorage.setItem('liangshan-v79-cache-version','7.9.0');alert('已清除 '+names.length+' 個快取，請重新開啟遊戲。');}
document.querySelector('#runCheck').addEventListener('click',run);document.querySelector('#clearCache').addEventListener('click',clearCache);run();
</script></body></html>
