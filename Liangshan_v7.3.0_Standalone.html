<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8a3b22"><title>水滸英雄傳：梁山風雲 v7.3.0 單一 HTML 版</title><style>:root{
  color-scheme:light;
  --bg:#f3ead7;
  --paper:#fffaf0;
  --paper-2:#f8efdc;
  --ink:#2c231d;
  --muted:#706258;

*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);background:
  radial-gradient(circle at 15% 0%,rgba(255,255,255,.75),transparent 30%),
  repeating-linear-gradient(0deg,rgba(80,55,32,.025),rgba(80,55,32,.025) 1px,transparent 1px,transparent 5px),var(--bg)}

  color-scheme:dark;--bg:#111210;--paper:#1c1e1b;--paper-2:#252820;--ink:#f2ead9;--muted:#b9ae9c;--line:#4d5146;--accent:#d87852;--accent-2:#e4a85e;--good:#73c99e;--warn:#e0b45f;--danger:#ec837d;--shadow:0 14px 38px rgba(0,0,0,.35)
}
body[data-theme="paper"]{
  color-scheme:light;--bg:#fff;--paper:#fff;--paper-2:#f6f6f6;--ink:#000;--muted:#333;--line:#000;--accent:#000;--accent-2:#333;--good:#000;--warn:#000;--danger:#000;--shadow:none
}
button,input,select,textarea{font:inherit}

a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
#app{width:min(1180px,100%);margin:auto;padding:18px 18px calc(76px + var(--safe-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{display:grid;place-items:center;width:50px;height:50px;border:2px solid var(--accent);border-radius:50%;font-weight:900;font-size:22px;background:var(--paper);box-shadow:var(--shadow)}
.brand-text{min-width:0}.brand-text b{display:block;font-size:clamp(17px,2.6vw,23px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-text small{color:var(--muted)}
.top-actions,.actions,.inline-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;padding:clamp(24px,5vw,58px);border:1px solid var(--line);border-radius:28px;background:
  linear-gradient(125deg,color-mix(in srgb,var(--paper) 96%,transparent),color-mix(in srgb,var(--paper-2) 90%,transparent));box-shadow:var(--shadow)}
.hero:after{content:"梁山";position:absolute;right:-16px;bottom:-42px;font-size:clamp(90px,18vw,220px);font-weight:900;color:color-mix(in srgb,var(--accent) 7%,transparent);line-height:1;pointer-events:none}
.hero>*{position:relative;z-index:1}.eyebrow{font-weight:800;letter-spacing:.16em;color:var(--accent);font-size:13px;text-transform:uppercase}.hero h1{margin:.35em 0 .2em;font-size:clamp(34px,7vw,72px);line-height:1.08;letter-spacing:.02em}.hero h2{margin:0 0 14px;font-size:clamp(17px,3vw,27px);font-weight:650;color:var(--accent)}.hero p{max-width:780px;font-size:clamp(16px,2vw,19px);line-height:1.85;color:var(--muted)}
.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h2,.card h3{margin:0 0 10px}.card p{line-height:1.72;margin:.5em 0;color:var(--muted)}.card.success{border-color:var(--good);background:color-mix(in srgb,var(--paper) 92%,var(--good) 8%)}.card.warning{border-color:var(--warn)}.card.current{border:2px solid var(--accent)}
.metric{display:flex;justify-content:space-between;align-items:end;gap:10px}.metric strong{font-size:clamp(29px,4vw,46px);line-height:1;color:var(--accent)}.metric span{color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);padding:11px 17px;font-weight:750;text-decoration:none;cursor:pointer;transition:.16s transform,.16s background,.16s border-color;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px}.btn:hover{transform:translateY(-1px);border-color:var(--accent)}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.good{background:var(--good);border-color:var(--good);color:#fff}.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.btn.icon{width:44px;padding:0}.btn.small{min-height:36px;padding:7px 12px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;margin:2px 4px 2px 0;font-size:13px;background:var(--paper-2);color:var(--muted)}.tag.good{border-color:var(--good);color:var(--good)}.tag.warn{border-color:var(--warn);color:var(--warn)}.tag.accent{border-color:var(--accent);color:var(--accent)}
.nav{position:sticky;top:8px;z-index:20;display:flex;gap:7px;align-items:center;overflow:auto;padding:8px;margin:0 0 16px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);box-shadow:var(--shadow)}.nav .btn{white-space:nowrap}.nav-spacer{flex:1}
.progress{height:12px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .25s}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 12px}.section-title h2{margin:0}.section-title p{margin:0;color:var(--muted)}
.chapter-toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:10px;margin:14px 0}.field{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--paper);color:var(--ink);padding:11px 13px;min-height:44px}
.chapter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.chapter-card{position:relative;text-align:left;min-height:190px;cursor:pointer;transition:.16s transform,.16s border-color}.chapter-card:hover{transform:translateY(-2px);border-color:var(--accent)}.chapter-card .chapter-no{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--accent);font-weight:900}.chapter-card .chapter-icon{font-size:34px}.chapter-card h3{font-size:18px;line-height:1.45;margin:10px 0 4px}.chapter-card p{font-size:14px}.chapter-card.completed:after{content:"✓";position:absolute;right:13px;bottom:10px;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--good);color:#fff;font-weight:900}.chapter-card.recommended{border:2px solid var(--accent)}
.portrait{display:flex;gap:14px;align-items:center}.avatar{display:grid;place-items:center;flex:0 0 auto;width:64px;height:64px;border-radius:19px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:28px;font-weight:900;border:2px solid color-mix(in srgb,var(--paper) 70%,transparent)}.portrait h3{margin:0}.portrait p{margin:3px 0}
.task-list{display:grid;gap:10px}.task{width:100%;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:15px;padding:13px;background:var(--paper);color:var(--ink);cursor:pointer}.task:hover:not(:disabled){border-color:var(--accent)}.task:disabled{opacity:.48;cursor:not-allowed}.task.done{border-color:var(--good);background:color-mix(in srgb,var(--paper) 92%,var(--good) 8%)}.task-icon{font-size:25px;text-align:center}.task b{display:block}.task small{display:block;margin-top:3px;color:var(--muted);line-height:1.5}.task-state{font-weight:900;color:var(--good)}
.status-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.statline{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;margin:10px 0;font-size:14px}.bar{height:13px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper-2)}.bar i{display:block;height:100%;background:var(--danger)}.bar.sp i{background:var(--accent-2)}
.battle-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fighter{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.fighter.enemy{border-color:color-mix(in srgb,var(--danger) 65%,var(--line))}.fighter-head{display:flex;justify-content:space-between;align-items:start;gap:12px}.battle-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:17px}.battle-actions .btn{border-radius:13px}.battle-note{margin-top:13px;padding:10px;border-radius:12px;background:var(--paper-2);color:var(--muted);font-size:14px}.log{max-height:250px;overflow:auto}.log div{padding:9px 0;border-bottom:1px dashed var(--line);line-height:1.55}.log div:first-child{color:var(--accent);font-weight:700}
.grade-badge{display:inline-grid;place-items:center;width:112px;height:112px;border:4px solid var(--accent);border-radius:50%;float:right;margin:0 0 12px 20px;background:var(--paper);box-shadow:var(--shadow)}.grade-badge span{font-size:51px;line-height:.9;font-weight:950;color:var(--accent)}.grade-badge small{font-weight:800;color:var(--muted)}
.roster-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.roster-card{padding:14px}.roster-card .avatar{width:50px;height:50px;border-radius:15px;font-size:22px}.roster-card h3{font-size:16px}.roster-card p{font-size:13px}
.achievement{display:flex;gap:12px;align-items:start;padding:12px 0;border-bottom:1px dashed var(--line)}.achievement:last-child{border:0}.achievement .medal{font-size:27px}.achievement.locked{opacity:.5}
.modal-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.55);backdrop-filter:blur(5px)}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.35)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}.modal h2{margin:0}.modal textarea{width:100%;min-height:220px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper-2);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.toast{position:relative;z-index:200;width:min(430px,calc(100vw - 30px));margin:8px auto;padding:13px 16px;border-radius:14px;background:var(--ink);color:var(--paper);box-shadow:var(--shadow);animation:toast-in .22s ease}.toast.good{background:var(--good);color:#fff}.toast.warn{background:var(--warn);color:#fff}@keyframes toast-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}#toastRoot{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));z-index:200;pointer-events:none}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}.muted{color:var(--muted)}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:2px 5px;font-size:.9em}.noscript{margin:30px;padding:20px;border:2px solid #900}
@media(max-width:900px){.grid.three,.grid.four,.chapter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.roster-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.status-grid{grid-template-columns:1fr}}
@media(max-width:650px){#app{padding:12px 12px calc(70px + var(--safe-bottom))}.topbar{align-items:flex-start}.brand-mark{width:43px;height:43px}.top-actions .label{display:none}.grid.two,.grid.three,.grid.four,.chapter-grid,.battle-grid{grid-template-columns:1fr}.roster-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.chapter-toolbar{grid-template-columns:1fr 1fr}.chapter-toolbar input{grid-column:1/-1}.hero{padding:25px 20px}.hero h1{font-size:36px}.nav{top:4px;border-radius:16px}.battle-actions{grid-template-columns:1fr}.grade-badge{float:none;margin:0 0 14px}.chapter-card{min-height:0}.task{grid-template-columns:36px 1fr auto;padding:12px}.fighter{padding:16px}}

@media print{.topbar,.nav,.actions,.top-actions,.btn{display:none!important}body{background:#fff}#app{width:100%;padding:0}.card,.hero{box-shadow:none;break-inside:avoid}}

/* v7.1.0 百八英雄深度玩法版 */
.update-banner{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:180;width:min(720px,calc(100vw - 24px));display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border:2px solid var(--accent);border-radius:18px;background:var(--paper);box-shadow:0 20px 60px rgba(0,0,0,.28)}
.update-banner b{display:block}.update-banner small{display:block;color:var(--muted);margin-top:3px}.update-banner .actions{flex-wrap:nowrap}
.flow-list{display:grid;gap:11px}.flow-step{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:var(--shadow)}.flow-step.current{border:2px solid var(--accent);background:color-mix(in srgb,var(--paper) 92%,var(--accent) 8%)}.flow-step.done{border-color:var(--good);background:color-mix(in srgb,var(--paper) 92%,var(--good) 8%)}.flow-step.locked{opacity:.55}.flow-index{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);font-weight:900}.flow-step.current .flow-index{background:var(--accent);color:#fff}.flow-step.done .flow-index{background:var(--good);color:#fff}.flow-step h3{margin:0 0 4px}.flow-step p{margin:0;color:var(--muted);line-height:1.55}.flow-step .btn{min-width:96px}
.skill-panel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}.skill-card{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--paper-2)}.skill-card b{display:block;color:var(--accent);margin-bottom:4px}.skill-card small{line-height:1.55;color:var(--muted)}
.boss-mechanic{margin-top:12px;padding:12px;border:1px solid var(--danger);border-radius:14px;background:color-mix(in srgb,var(--paper) 92%,var(--danger) 8%)}.boss-mechanic b{color:var(--danger)}
.shop-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.shop-card{display:flex;flex-direction:column}.shop-card .shop-icon{font-size:42px}.shop-card .shop-level{font-weight:900;color:var(--accent);font-size:20px}.shop-card .btn{margin-top:auto}.price{font-weight:900;color:var(--warn)}
.filter-summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}.recent-mark{position:absolute;left:13px;bottom:10px;font-size:12px;color:var(--accent);font-weight:800}.draft-mark{border-color:var(--warn)!important}.chapter-card.draft-mark:before{content:"進行中";position:absolute;right:12px;top:50px;background:var(--warn);color:#fff;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800}
.inventory-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.level-pips{display:flex;gap:4px;margin:8px 0}.level-pips i{width:18px;height:7px;border-radius:999px;background:var(--line)}.level-pips i.on{background:var(--accent)}
.status-effect{display:inline-flex;padding:3px 8px;border:1px solid var(--warn);border-radius:999px;color:var(--warn);font-size:12px;margin:2px}.status-effect.good{border-color:var(--good);color:var(--good)}
@media(max-width:900px){.shop-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.chapter-toolbar{grid-template-columns:1fr 1fr}.chapter-toolbar input{grid-column:1/-1}.shop-grid,.skill-panel{grid-template-columns:1fr}.flow-step{grid-template-columns:36px 1fr}.flow-step>.btn{grid-column:1/-1;width:100%}.update-banner{align-items:flex-start;flex-direction:column}.update-banner .actions{width:100%;flex-wrap:wrap}.update-banner .btn{flex:1}}

/* v7.2.0 梁山聚義養成版 */
.hero.compact{padding:32px}.hero.compact h1{font-size:clamp(32px,6vw,58px)}
.materials-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:var(--shadow)}
.materials-bar span{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:var(--paper-2);font-weight:750;font-size:14px}
.team-mini{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}.team-mini:last-of-type{border-bottom:0}.team-mini .avatar{width:45px;height:45px;border-radius:13px;font-size:20px}.team-mini b,.team-mini small{display:block}.team-mini small{color:var(--muted);margin-top:3px}

.difficulty-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px}
.formation-board{margin-top:16px}.formation-row{display:grid;grid-template-columns:80px 1fr 1fr;gap:12px;align-items:stretch;margin:12px 0}.formation-row>b{display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:var(--paper-2)}.formation-slot{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:13px;background:var(--paper)}.formation-slot .avatar{width:50px;height:50px;border-radius:15px;font-size:22px}.formation-slot>div{min-width:0;flex:1}.formation-slot b,.formation-slot small{display:block}.formation-slot small{color:var(--muted);margin-top:5px}.formation-slot select{margin-top:6px}

  function loadStateSync(){try{const text=storage.getItem(SAVE_KEY);const raw=JSON.parse(text||'null');if(raw){if(raw.version&&raw.version!==VERSION&&!storage.getItem(`${BACKUP_PREFIX}v${raw.version}`))storage.setItem(`${BACKUP_PREFIX}v${raw.version}`,text);return mergeState(raw);}}catch{}return mergeState(freshState());}

  function openDb(){
    if(!('indexedDB'in window))return Promise.reject(new Error('IndexedDB unavailable'));
    if(dbPromise)return dbPromise;
    dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('saves'))db.createObjectStore('saves',{keyPath:'id'});if(!db.objectStoreNames.contains('backups')){const store=db.createObjectStore('backups',{keyPath:'id'});store.createIndex('createdAt','createdAt');}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});return dbPromise;
  }
  async function idbGet(storeName,key){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readonly');const req=tx.objectStore(storeName).get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
  async function idbPut(storeName,value){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readwrite');tx.objectStore(storeName).put(value);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);});}
  async function idbAll(storeName){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readonly');const req=tx.objectStore(storeName).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);});}
  async function idbDelete(storeName,key){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readwrite');tx.objectStore(storeName).delete(key);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);});}

  }

  function heroCombatStats(number,row='front',guest=false){
    const ch=chapter(number);const h=getHero(number);const weapon=itemStats(getItem(h.equipment.weapon));const armor=itemStats(getItem(h.equipment.armor));const set=equipmentSetBonus(number);const hall=buildingLevel('hall');const smithy=buildingLevel('smithy');const intel=buildingLevel('intelligence');const level=h.level;const power=treeRank(h,'power');const guard=treeRank(h,'guard');const tactics=treeRank(h,'tactics');const pBranch=treeBranch(h,'power');const gBranch=treeBranch(h,'guard');const tBranch=treeBranch(h,'tactics');
    let baseHp=620+level*70+number*2;let baseSp=270+level*18;let atk=72+level*11+number*.35+(weapon.atk||0)+smithy*2;let def=35+level*5+number*.15+(armor.def||0)+guard*4;let hp=(baseHp+(armor.hp||0))*(1+guard*.045+hall*.025);let sp=baseSp+(armor.sp||0)+tactics*12+buildingLevel('stable')*4;let speed=78+level*1.7+(weapon.speed||0)+(armor.speed||0)+buildingLevel('stable')*3+(ch.kind==='transport'?14:0)+(ch.kind==='stealth'?10:0);

  function selectTalent(number,category,branch){const h=getHero(number);const opts=TREE_OPTIONS[category]?.options||[];if(!opts.some(x=>x.key===branch))return;if(h.skillPoints<=0)return toast('沒有可用技能點。','warn');const node=h.tree[category];if(node.branch&&node.branch!==branch&&node.rank>0)return toast('此路線已選定；請先重置技能樹。','warn');if(node.rank>=3)return toast('此分支已達最高 3 級。','warn');node.branch=branch;node.rank++;h.skillPoints--;save(true);renderHeroes();tone('achievement');}

  function applyChoiceToParty(party,choice){for(const a of party){if(choice?.shield)a.shield+=choice.shield;if(choice?.sp)a.sp=clamp(a.sp+choice.sp,0,a.maxSp);if(choice?.hp){a.maxHp=Math.round(a.maxHp*choice.hp);a.hp=a.maxHp;}if(choice?.speed)a.speed=Math.round(a.speed*choice.speed);if(choice?.crit)a.crit+=choice.crit;if(choice?.frontAtk&&a.row==='front')a.atk=Math.round(a.atk*choice.frontAtk);if(choice?.frontDef&&a.row==='front')a.def=Math.round(a.def*choice.frontDef);if(choice?.backAtk&&a.row==='back')a.atk=Math.round(a.atk*choice.backAtk);if(choice?.allyAtk)a.atk=Math.round(a.atk*choice.allyAtk);if(a.guest&&choice?.guestSpeed)a.speed+=choice.guestSpeed;}}
  function buildInitiative(b){const units=[...b.allies,...b.enemies].filter(x=>x.alive&&x.hp>0);b.queue=units.map(u=>{const haste=u.statuses?.haste?.duration>0?(u.statuses.haste.power||0):0;const slow=u.statuses?.slow?.duration>0?(u.statuses.slow.power||0):0;return{id:u.id,team:u.team,score:u.speed+haste-slow+rand(0,12)};}).sort((a,c)=>c.score-a.score);b.cursor=0;b.roundStartAt=now();}

  function aliveAllies(b=state.current?.battle){return b?b.allies.filter(x=>x.alive&&x.hp>0):[];}

  function selectedEnemy(b=state.current?.battle){if(!b)return null;const direct=b.enemies[b.targetIndex];if(direct?.alive&&direct.hp>0)return direct;const i=b.enemies.findIndex(e=>e.alive&&e.hp>0);b.targetIndex=Math.max(0,i);return b.enemies[i]||null;}
  function addStatus(entity,key,duration=2,power=1){entity.statuses=entity.statuses||{};const old=entity.statuses[key]||{duration:0,power:0};entity.statuses[key]={duration:Math.max(old.duration,duration),power:Math.max(old.power,power)};}
  function statusLabel(key){return({poison:'中毒',burn:'燃燒',bleed:'流血',stun:'暈眩',armorBreak:'破甲',power:'鼓舞',slow:'遲緩',haste:'神行',taunt:'嘲諷',counter:'反擊',weaken:'挫銳',precision:'透陣'})[key]||key;}

  function applyHit(target,amount,{pierce=false,crit=false,source='攻擊',skill=false,attacker=null}={}){

  function triggerBossPhase(boss,next){if(!boss.alive||next<=boss.phase)return;boss.phase=next;boss.pendingPhase=0;const b=state.current.battle;b.phaseNotice=`${boss.name}進入第 ${next} 階段：${boss.mechanic.name}`;b.log.unshift(b.phaseNotice);if(next===2){if(boss.mechanic.key==='armor'){boss.statuses.counter={duration:99,power:.18};boss.shield+=Math.round(boss.maxHp*.14);}if(boss.mechanic.key==='enrage'){boss.atk=Math.round(boss.atk*1.25);boss.speed+=12;}if(boss.mechanic.key==='regen'){const heal=Math.round(boss.maxHp*.12);boss.hp=Math.min(boss.maxHp,boss.hp+heal);boss.statuses={};}if(boss.mechanic.key==='reinforce')b.enemies.push(makeEnemy(currentChapter(),2,b.enemies.length,b.difficulty));if(boss.mechanic.key==='poison')aliveAllies(b).forEach(a=>addStatus(a,'poison',3,26));if(boss.mechanic.key==='counter')boss.statuses.counter={duration:99,power:.24};}

  }
  function skillCost(ally,type){const h=getHero(ally.number);const rank=treeRank(h,'tactics');const flow=treeBranch(h,'tactics')==='flow';const civic=ally.kind==='civic'?8:0;return type==='skill'?Math.max(34,62-rank*4-(flow?rank*4:0)-civic):Math.max(68,104-rank*5-(flow?rank*5:0)-civic);}
  function damageFormula(ally,target,mult=1,skill=false){const h=getHero(ally.number);const choice=chosenStory();let bonus=1;if(ally.row==='back')bonus*=ally.backBonus||1;if(ally.kind==='story')bonus*=1+(1-ally.hp/ally.maxHp)*.35;if(ally.kind==='wild'&&Object.values(target.statuses||{}).some(x=>x?.duration>0))bonus*=1.20*(choice?.debuffDamage||1);if(ally.kind==='stealth'&&state.current.battle.round===1)bonus*=1.25;if(ally.kind==='water')bonus*=1+buildingLevel('waterCamp')*.025;if(ally.statuses?.power?.duration>0)bonus*=1+(ally.statuses.power.power||18)/100;if(ally.statuses?.precision?.duration>0)bonus*=1+(ally.statuses.precision.power||14)/100;if(treeBranch(h,'power')==='fury'&&ally.hp<ally.maxHp*.5)bonus*=1+treeRank(h,'power')*.08;if(skill)bonus*=ally.skillBonus||1;return Math.max(18,ally.atk*mult*bonus+rand(-7,17)-effectiveDef(target)*.20);}
  function healLowest(party,amount){const target=party.filter(x=>x.alive).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];if(target)target.hp=clamp(target.hp+Math.round(amount),0,target.maxHp);return target;}

  function applySignatureModifier(ally,target){

  function applyHeroSkill(ally,target,system=false){const b=state.current.battle;const kit=ally.kit;const potency=kit.potency+(ally.awakened?8:0);let note='';switch(kit.effect){case'execute':if(target.hp/target.maxHp<.35){const d=applyHit(target,damageFormula(ally,target,.70,true),{pierce:true,source:kit.skillName,skill:true,attacker:ally});note=`追斬 ${d}`;}break;case'chain':{const d=applyHit(target,damageFormula(ally,target,.48,true),{source:kit.skillName,skill:true,attacker:ally});note=`追加 ${d}`;}break;case'sunder':addStatus(target,'armorBreak',ally.awakened?4:3,30+potency);note='造成破甲';break;case'heal':{const t=healLowest(aliveAllies(b),ally.atk*(.8+potency/100)*ally.healBonus);note=`治療 ${t?.name||'隊友'}`;}break;case'sweep':aliveEnemies(b).filter(e=>e!==target).forEach(e=>applyHit(e,damageFormula(ally,e,.58,true),{source:kit.skillName,skill:true,attacker:ally}));note='橫掃全敵';break;case'stun':if(Math.random()<ally.statusChance+.28+(ally.awakened ? .12 : 0))addStatus(target,'stun',1,1);note='嘗試震懾';break;case'bleed':addStatus(target,'bleed',ally.awakened?4:3,22+potency);note='附加流血';break;case'focus':ally.sp=clamp(ally.sp+55+potency,0,ally.maxSp);b.comboGauge=clamp(b.comboGauge+28,0,100);note='回復豪氣與合擊';break;case'shield':aliveAllies(b).forEach(a=>a.shield+=80+potency*3);note='全隊護盾';break;case'counter':ally.statuses.counter={duration:2,power:.45+(ally.awakened ? .15 : 0)};note='進入反擊';break;case'haste':aliveAllies(b).forEach(a=>addStatus(a,'haste',2,12+potency));note='全隊神行';break;case'cleanse':aliveAllies(b).forEach(cleanse);note='解除全隊負面狀態';break;}const signature=applySignatureModifier(ally,target);if(signature)note+=`${note?'，':''}${signature}`;if(ally.kind==='health'){const t=healLowest(aliveAllies(b),ally.atk*.50*ally.healBonus);if(t)note+=`，濟護 ${t.name}`;}if(ally.kind==='justice')addStatus(target,'armorBreak',3,32);return note;}

  function performCombo(){const b=state.current.battle;const bond=activeBonds().find(x=>x.name===b.activeBond)||activeBonds()[0];if(!bond||b.comboGauge<100)return false;b.comboGauge=0;const party=aliveAllies(b);const avgAtk=party.reduce((s,a)=>s+a.atk,0)/Math.max(1,party.length);let mult=1.25;if(bond.status==='boss'&&aliveEnemies(b).some(e=>e.type==='boss'))mult=1.65;if(bond.status==='desperate'&&party.some(a=>a.hp<a.maxHp*.45))mult=1.85;aliveEnemies(b).forEach(e=>{applyHit(e,avgAtk*mult,{pierce:true,crit:bond.status==='crit',source:bond.name,skill:true});if(['burn','bleed','armorBreak','stun'].includes(bond.status))addStatus(e,bond.status,bond.status==='stun'?1:3,28);if(bond.status==='slow')addStatus(e,'slow',2,15);});if(bond.status==='shield')party.forEach(a=>{a.shield+=180;a.sp=clamp(a.sp+80,0,a.maxSp);});if(bond.status==='power')party.forEach(a=>addStatus(a,'power',3,18));if(bond.status==='heal'){party.forEach(a=>a.hp=clamp(a.hp+220,0,a.maxHp));state.current.medicines=Math.min(5,state.current.medicines+1);}state.current.stats.combos++;b.log.unshift(`發動羈絆合擊「${bond.name}」：${bond.text}`);tone('achievement');return true;}

  function enemyAct(enemy){const b=state.current.battle;if(!enemy?.alive)return;const stun=enemy.statuses?.stun;if(stun?.duration>0){b.log.unshift(`${enemy.name}暈眩，無法行動。`);return;}if(bossSpecial(enemy,b))return;const attacks=enemy.type==='boss'&&enemy.mechanic?.key==='enrage'&&enemy.phase===3?2:1;for(let k=0;k<attacks;k++){const target=chooseEnemyTarget(enemy,b);if(!target)break;let mult=1;if(target.row==='front')mult*=.82;if(target.guarding)mult*=.45;if(enemy.type==='caster'&&target.row==='back')mult*=1.18;if(enemy.type==='boss'&&enemy.phase===3)mult*=1.12;let damage=Math.max(10,enemy.atk*mult*(enemy.statuses?.weaken?.duration>0?Math.max(.55,1-(enemy.statuses.weaken.power||15)/100):1)+rand(-7,14)-target.def*.35);if(target.statuses?.power?.duration>0)damage*=.92;if(chosenStory()?.frontTaken&&target.row==='front')damage*=chosenStory().frontTaken;if(target.shield>0){const absorbed=Math.min(target.shield,Math.round(damage));target.shield-=absorbed;damage-=absorbed;if(absorbed)b.log.unshift(`${target.name}護盾吸收 ${absorbed} 傷害。`);}damage=Math.max(0,Math.round(damage));target.hp=Math.max(0,target.hp-damage);b.log.unshift(`${enemy.name}攻擊${target.name}，造成 ${damage} 傷害。`);if(enemy.type==='boss'&&enemy.mechanic?.key==='poison')addStatus(target,'poison',3,enemy.phase===3?34:22);if(enemy.type==='caster'&&Math.random()<.30)addStatus(target,'burn',2,18);if(target.statuses?.counter?.duration>0&&target.alive){const reflected=Math.round(target.atk*target.statuses.counter.power);enemy.hp=Math.max(0,enemy.hp-reflected);b.log.unshift(`${target.name}反擊 ${reflected} 傷害。`);if(enemy.hp<=0)enemy.alive=false;}if(target.hp<=0){target.alive=false;b.log.unshift(`${target.name}重傷退陣。`);}}
  }
  function advanceToPlayable(){clearAutoTimer();const b=state.current?.battle;if(!b)return;if(aliveEnemies(b).length===0)return battleVictory();if(aliveAllies(b).length===0)return handleDefeat();let actor=currentActor(b);if(!actor){endRound();actor=currentActor(b);if(!actor)return;}if(actor.team==='enemy'){battleBusy=true;const delay=Math.round(520/Math.max(1,b.speed||1));autoTimer=setTimeout(()=>{enemyAct(actor);moveCursor();battleBusy=false;save(true);renderBattle();advanceToPlayable();},delay);return;}if(actor.statuses?.stun?.duration>0){b.log.unshift(`${actor.name}暈眩，跳過行動。`);moveCursor();save(true);renderBattle();advanceToPlayable();return;}if(b.auto)queueAuto();}
  function battleAction(action){if(battleBusy||!state.current?.battle)return;clearAutoTimer();const run=state.current;const b=run.battle;const ally=currentActor(b);const target=selectedEnemy(b);if(!ally||ally.team!=='ally'||!target)return;battleBusy=true;let acted=false;let damage=0;let label='';let note='';const skill=skillCost(ally,'skill'),system=skillCost(ally,'system');ally.guarding=false;
    if(action==='attack'){acted=true;label=`${ally.nickname}進擊`;damage=damageFormula(ally,target,1,false);}
    if(action==='skill'&&ally.sp>=skill){acted=true;ally.sp-=skill;label=ally.kit.skillName;damage=damageFormula(ally,target,1.62,true);note=applyHeroSkill(ally,target,false);}
    if(action==='system'&&ally.sp>=system){acted=true;ally.sp-=system;label=ally.kit.awakeningName;const targets=aliveEnemies(b);targets.forEach(e=>applyHit(e,damageFormula(ally,e,1.22+(ally.awakened ? .18 : 0),true),{pierce:ally.kind==='justice',source:label,skill:true,attacker:ally}));note=applyHeroSkill(ally,target,true);damage=0;}
    if(action==='guard'){acted=true;ally.guarding=true;ally.sp=clamp(ally.sp+50,0,ally.maxSp);ally.shield+=65+buildingLevel('infirmary')*8;if(ally.kind==='military'||treeBranch(getHero(ally.number),'guard')==='riposte')ally.statuses.taunt={duration:1,power:1};label='守勢回氣';note='回復豪氣並提高防禦';}
    if(action==='medicine'&&run.medicines>0){acted=true;run.medicines--;run.stats.medicinesUsed++;const heal=Math.round((270+buildingLevel('infirmary')*45)*(chosenStory()?.heal||1)*ally.healBonus);ally.hp=clamp(ally.hp+heal,0,ally.maxHp);if(chosenStory()?.cleanse)cleanse(ally);else{delete ally.statuses.poison;delete ally.statuses.burn;}label='使用金瘡藥';note=`回復 ${heal} 氣血`;}
    if(action==='combo'){acted=performCombo();label='聚義合擊';}
    if(!acted){battleBusy=false;advanceToPlayable();return;}
    if(damage>0){const crit=Math.random()<ally.crit;let final=crit?damage*1.55:damage;const dealt=applyHit(target,final,{pierce:ally.kind==='justice',crit,source:label,skill:action!=='attack',attacker:ally});b.log.unshift(`${ally.name}施展「${label}」，對${target.name}造成 ${dealt} 傷害${note?`，${note}`:''}。`);}else if(action!=='combo')b.log.unshift(`${ally.name}施展「${label}」${note?`，${note}`:''}。`);
    const boss=b.enemies.find(e=>e.type==='boss'&&e.alive&&e.statuses?.counter?.duration>0);if(boss&&['skill','system'].includes(action)){const reflected=Math.round(Math.max(18,damage||ally.atk)*boss.statuses.counter.power);ally.hp=Math.max(0,ally.hp-reflected);b.log.unshift(`${boss.name}發動反震，${ally.name}受到 ${reflected} 傷害。`);if(ally.hp<=0)ally.alive=false;}
    const comboMult=chosenStory()?.combo||1;b.comboGauge=clamp(b.comboGauge+Math.round((ally.kind==='transport'?28:18)*comboMult),0,100);run.stats.actions++;if(aliveEnemies(b).length===0){battleBusy=false;return battleVictory();}if(aliveAllies(b).length===0){battleBusy=false;return handleDefeat();}moveCursor();save(true);renderBattle();battleBusy=false;advanceToPlayable();
  }
  function smartAction(){const b=state.current?.battle;if(!b)return;const ally=currentActor(b);if(!ally||ally.team!=='ally')return;const strategy=prefs.autoStrategy;if(b.comboGauge>=100&&b.activeBond&&(strategy!=='safe'||aliveAllies(b).some(a=>a.hp<a.maxHp*.75)))return battleAction('combo');if(ally.hp<ally.maxHp*(strategy==='safe' ? .48 : .30)&&state.current.medicines>0)return battleAction('medicine');const sys=skillCost(ally,'system'),sk=skillCost(ally,'skill');if(strategy==='control'&&ally.sp>=sk)return battleAction('skill');if(ally.sp>=sys&&(aliveEnemies(b).length>1||strategy==='aggressive'))return battleAction('system');if(ally.sp>=sk)return battleAction('skill');if(ally.hp<ally.maxHp*(strategy==='safe' ? .65 : .45))return battleAction('guard');return battleAction('attack');}
  function clearAutoTimer(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}}
  function queueAuto(){clearAutoTimer();const b=state.current?.battle;if(!b||!b.auto)return;const actor=currentActor(b);if(!actor)return;const stableBoost=1+(buildingLevel('stable')-1)*.08;const delay=Math.round(850/(Math.max(1,b.speed||1)*stableBoost));autoTimer=setTimeout(()=>{if(state.current?.battle?.auto)smartAction();},delay);}
  function setBattleSpeed(speed){const s=clamp(Number(speed)||1,1,3);prefs.battleSpeed=s;if(state.current?.battle)state.current.battle.speed=s;save(true);renderBattle();advanceToPlayable();}
  function toggleAuto(){prefs.autoBattle=!prefs.autoBattle;if(state.current?.battle)state.current.battle.auto=prefs.autoBattle;save(true);renderBattle();advanceToPlayable();}

  function battleVictory(){clearAutoTimer();const run=state.current;const b=run.battle;const stage=b.stage;const ch=currentChapter();const d=DIFFICULTIES[b.difficulty];const choice=chosenStory(run);const base=[125,200,335][stage]+ch.number*3;const tradeBonus=b.allies.filter(a=>a.kind==='trade').length*20;const bonus=b.enemies.reduce((s,e)=>s+Number(e.bonusSilver||0),0);const reward=Math.round((base+tradeBonus+bonus)*d.reward*(choice?.reward||1));const xp=Math.round(([75,120,195][stage]+ch.number)*d.xp*(1+buildingLevel('hall')*.04));const matMult=choice?.material||1;const materialReward={iron:Math.round((stage===2?5:2)*matMult),wood:Math.round((stage===1?4:2)*matMult),cloth:Math.round((stage===0?3:2)*matMult),essence:stage===2?2:0};run.battles[String(stage)]=true;run.silverEarned+=reward;state.silver+=reward;Object.entries(materialReward).forEach(([k,v])=>state.inventory.materials[k]+=v);b.allies.forEach(a=>{const h=getHero(a.number);h.wins++;const levels=grantXp(a.number,a.guest?Math.round(xp*.8):xp);if(levels.length)run.log.unshift(`${a.name}升至 ${levels.at(-1)} 級，獲得技能點。`);});if(stage===2){const protagonist=b.allies.find(a=>a.number===ch.number);run.stats.guestSurvived=Boolean(protagonist?.alive&&protagonist.hp>0);}run.medicines=Math.min(5,run.medicines+1);run.log.unshift(`第 ${stage+1} 場勝利：獲得 ${reward} 銀兩、英雄經驗與素材。`);run.battle=null;screen='chapter';save(true);if(stage===2)createBackup(`完成第 ${ch.number} 回首領戰`);toast(`戰鬥勝利，獲得 ${reward} 銀兩與養成素材。`,'good');tone('victory');render();}
  function handleDefeat(){clearAutoTimer();const run=state.current;run.stats.defeats++;run.battle=null;screen='chapter';save(true);toast('隊伍失利，已退回戰前；章回進度完整保留。','warn');render();}
  function computeResult(run){let score=100;score-=Math.max(0,run.stats.actions-30);score-=run.stats.defeats*12;score-=run.stats.medicinesUsed*4;score+=Math.min(6,run.stats.combos*2);score+=run.stats.guestSurvived?4:0;score=clamp(Math.round(score),40,100);const grade=score>=90?'S':score>=78?'A':score>=65?'B':'C';const achievements=[];if(run.clues.length===4)achievements.push('明察四證');if(run.stats.defeats===0)achievements.push('三戰連捷');if(run.stats.medicinesUsed===0)achievements.push('無藥制勝');if(run.stats.combos>0)achievements.push('聚義合擊');if(run.stats.guestSurvived)achievements.push(`${currentChapter().nickname}主角無傷歸陣`);if(run.choiceEventDone)achievements.push(`${storyMode(currentChapter()).name}決斷`);return{score,grade,achievements};}
  function finishChapter(){const run=state.current;if(!run||!canPerform(run,'finish',0)||!run.battles['2'])return;const result=computeResult(run);const ch=currentChapter();run.complete=true;run.score=result.score;run.grade=result.grade;run.achievements=result.achievements;const reward=230+ch.number*4;state.silver+=reward;run.silverEarned+=reward;state.inventory.materials.essence+=result.grade==='S'?3:1;const previous=state.completed[String(ch.number)];const record={grade:result.grade,score:result.score,actions:run.stats.actions,rounds:run.stats.rounds,defeats:run.stats.defeats,medicinesUsed:run.stats.medicinesUsed,combos:run.stats.combos,guestSurvived:run.stats.guestSurvived,choice:run.choice,achievements:result.achievements,completedAt:now(),source:`v${VERSION} ${EDITION}`};if(!previous||Number(previous.score||0)<=result.score)state.completed[String(ch.number)]=record;state.unlocked=Math.max(state.unlocked,Math.min(108,ch.number+1));state.selected=Math.min(108,ch.number+1);state.formations.forEach(p=>repairPlan(p));state.runs[String(ch.number)]=run;screen='ending';save(true);createBackup(`完成第 ${ch.number} 回`);render();tone('achievement');}

  function craftCost(type){const lv=buildingLevel('smithy');return type==='weapon'?{silver:230+lv*55,iron:8+lv*2,wood:3}:{silver:220+lv*50,iron:5+lv,cloth:7+lv*2};}
  function rollRarity(){const smithy=buildingLevel('smithy');const r=Math.random()*100;const epic=RARITIES.epic.weight+smithy*2;const rare=RARITIES.rare.weight+smithy*3;return r<epic?'epic':r<epic+rare?'rare':'common';}
  function craftItem(type){if(!ITEM_TEMPLATES[type])return;const cost=craftCost(type);if(state.silver<cost.silver)return toast('銀兩不足。','warn');for(const[k,v]of Object.entries(cost))if(k!=='silver'&&(state.inventory.materials[k]||0)<v)return toast(`${k==='iron'?'鐵礦':k==='wood'?'木材':'布料'}不足。`,'warn');state.silver-=cost.silver;Object.entries(cost).forEach(([k,v])=>{if(k!=='silver')state.inventory.materials[k]-=v;});const template=ITEM_TEMPLATES[type][rand(0,ITEM_TEMPLATES[type].length-1)];const rarity=rollRarity();const id=`v73-${Date.now()}-${state.inventory.nextItemId++}`;const stats={};Object.entries(template).forEach(([k,v])=>{if(['name','icon','setKey'].includes(k))return;if(typeof v==='number')stats[k]=v;});state.inventory.items.push({id,type,name:template.name,icon:template.icon,setKey:template.setKey,rarity,level:1,stats,createdAt:now(),equippedBy:null});save(true);renderForge();toast(`鍛造完成：${RARITIES[rarity].name}${template.name}。`,'good');tone('achievement');}
  function upgradeItem(id){const item=getItem(id);if(!item)return;if(item.level>=5)return toast('裝備已達 5 級。','warn');const cost=170*item.level;const essence=item.level>=3?1:0;if(state.silver<cost||state.inventory.materials.essence<essence)return toast('銀兩或精華不足。','warn');state.silver-=cost;state.inventory.materials.essence-=essence;item.level++;save(true);renderForge();toast(`${item.name}已強化至 +${item.level}。`,'good');}
  function dismantleItem(id){const item=getItem(id);if(!item)return;if(item.equippedBy)return toast('已裝備的物品無法分解。','warn');if(state.inventory.items.length<=2)return toast('至少保留兩件裝備。','warn');const mult=item.rarity==='epic'?3:item.rarity==='rare'?2:1;state.inventory.materials[item.type==='weapon'?'iron':'cloth']+=3*mult+item.level;state.inventory.materials.essence+=item.rarity==='epic'?2:item.rarity==='rare'?1:0;state.inventory.items=state.inventory.items.filter(x=>x.id!==id);save(true);renderForge();toast(`${item.name}已分解為素材。`,'good');}
  function buildingCost(key){const level=buildingLevel(key);const material=BUILDINGS[key].material;return{silver:400+level*320,material,amount:10+level*7,essence:level>=3?level-2:0};}
  function upgradeBuilding(key){const b=BUILDINGS[key];if(!b)return;const level=buildingLevel(key);if(level>=5)return toast('建築已達最高 5 級。','good');const c=buildingCost(key);if(state.silver<c.silver||(state.inventory.materials[c.material]||0)<c.amount||state.inventory.materials.essence<c.essence)return toast('升級資源不足。','warn');state.silver-=c.silver;state.inventory.materials[c.material]-=c.amount;state.inventory.materials.essence-=c.essence;state.base[key]=level+1;save(true);renderBase();toast(`${b.name}升至 ${level+1} 級。`,'good');tone('achievement');}
  function buyMedicine(){const cost=Math.max(70,130-buildingLevel('infirmary')*10);if(state.silver<cost)return toast('銀兩不足。','warn');if(state.inventory.medicines>=99)return toast('備用藥品已達上限。','warn');state.silver-=cost;state.inventory.medicines++;save(true);renderForge();toast('已購買一份備用金瘡藥。','good');}
  function claimMedicine(){const run=state.current;if(!run||run.medicines>=5)return toast('本回藥品已達上限。','warn');if(state.inventory.medicines<=0)return toast('倉庫沒有備用藥品。','warn');state.inventory.medicines--;run.medicines++;save(true);renderChapter();toast('已領用一份金瘡藥。','good');}

  function topbar(subtitle=''){return`<header class="topbar"><div class="brand"><div class="brand-mark">梁</div><div class="brand-text"><b>水滸英雄傳：梁山風雲</b><small>v${VERSION} ${EDITION}${subtitle?`・${esc(subtitle)}`:''}</small></div></div><div class="top-actions"><button class="btn icon" data-act="theme" title="切換顯示模式">◐</button><button class="btn icon" data-act="speech" title="朗讀本頁">朗</button><button class="btn icon" data-act="manage" title="存檔管理">存</button></div></header>`;}
