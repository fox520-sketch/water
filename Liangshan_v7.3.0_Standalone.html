  function materialsBar(){const m=state.inventory.materials;return`<div class="materials-bar"><span>⛓️ 鐵礦 ${m.iron}</span><span>🪵 木材 ${m.wood}</span><span>🧵 布料 ${m.cloth}</span><span>✨ 精華 ${m.essence}</span><span>💊 藥品 ${state.inventory.medicines}</span><span>💾 ${esc(state.saveMeta.backend)}</span></div>`;}
  function renderHome(){screen='home';clearAutoTimer();const recommended=firstIncomplete();const bonds=activeBonds();app.innerHTML=`${topbar()}${nav()}${state.saveMeta.warning?`<div class="warning-banner">⚠️ ${esc(state.saveMeta.warning)}</div>`:''}<section class="hero"><span class="eyebrow">STRATEGIC TURN RPG</span><h1>梁山英雄覺醒與戰略回合版</h1><h2>速度回合・英雄覺醒・分支技能・三套編隊・IndexedDB 備份</h2><p>108 名英雄各有專屬技與覺醒能力；完整回合依速度排序，首領在 70% 與 35% 氣血必定換階。章回主角以客將參戰，故事選擇會改變敵情、獎勵與戰鬥規則。</p><div class="actions"><button class="btn primary" data-act="continue">${state.current&&!state.current.complete?'繼續目前章回':'開始推薦章回'}</button><button class="btn" data-act="team">戰前編隊</button><button class="btn" data-chapter="${recommended}">第 ${recommended} 回</button></div></section>${materialsBar()}<div class="grid four" style="margin-top:16px"><section class="card metric"><div><span>章回完成</span><strong>${completionCount()}</strong></div><b>/108</b></section><section class="card metric"><div><span>覺醒英雄</span><strong>${Object.values(state.heroes).filter(h=>h.awakened).length}</strong></div><b>/108</b></section><section class="card metric"><div><span>目前編隊</span><strong>${state.activeFormation+1}</strong></div><b>/3</b></section><section class="card metric"><div><span>自動備份</span><strong>${state.saveMeta.backupCount||0}</strong></div><b>份</b></section></div><div class="grid two" style="margin-top:16px"><section class="card"><h2>${esc(currentPlan().name)}</h2>${formationRows().map(x=>heroMini(x.number,x.row)).join('')}<div class="actions"><button class="btn" data-act="team">多套編隊</button><button class="btn" data-act="heroes">英雄覺醒</button></div></section><section class="card"><h2>已啟動羈絆</h2>${bonds.length?bonds.map(b=>`<div class="achievement"><span class="medal">🤝</span><div><b>${esc(b.name)}</b><p>${esc(b.text)}</p></div></div>`).join(''):'<p>目前隊伍尚未組成已登錄羈絆。</p>'}<div class="actions"><button class="btn" data-act="forge">裝備套裝</button><button class="btn" data-act="base">建設梁山</button></div></section></div>`;}
  function heroMini(number,row){const ch=chapter(number);const h=getHero(number);return`<div class="team-mini"><div class="avatar">${esc(ch.name[0])}</div><div><b>${esc(ch.nickname)}・${esc(ch.name)} ${h.awakened?'✦':''}</b><small>${row==='front'?'前排':'後排'}・Lv.${h.level}・${kindData(ch).label}</small></div></div>`;}

  function renderChapters(){screen='chapters';clearAutoTimer();const q=chapterSearch.trim().toLowerCase();const first=firstIncomplete();const recentSet=new Set(state.recent);const list=chapters.filter(ch=>{if(chapterEra!=='all'&&ch.era!==chapterEra)return false;if(chapterStatus==='unfinished'&&state.completed[String(ch.number)])return false;if(chapterStatus==='nonS'&&state.completed[String(ch.number)]?.grade==='S')return false;if(chapterStatus==='recent'&&!recentSet.has(ch.number))return false;if(q&&!`${ch.number}${ch.name}${ch.nickname}${ch.title}${ch.focus}`.toLowerCase().includes(q))return false;return true;});app.innerHTML=`${topbar('章回總覽')}${nav()}<section class="page-head"><div><span class="eyebrow">108 CHAPTERS</span><h1>完整章回</h1><p>搜尋英雄、綽號、章回或主題；每回的玩法類型、流程順序與故事抉擇不同。</p></div><button class="btn primary" data-chapter="${first}">前往第 ${first} 回</button></section><div class="chapter-toolbar"><input class="field" id="chapterSearch" placeholder="搜尋英雄、章回、主題" value="${esc(chapterSearch)}"><select class="field" id="chapterEra"><option value="all">全部篇章</option>${['經典篇','制度續篇','百業聚義篇'].map(x=>`<option ${chapterEra===x?'selected':''}>${x}</option>`).join('')}</select><select class="field" id="chapterStatus"><option value="all">全部狀態</option><option value="unfinished" ${chapterStatus==='unfinished'?'selected':''}>未完成</option><option value="nonS" ${chapterStatus==='nonS'?'selected':''}>非 S 級</option><option value="recent" ${chapterStatus==='recent'?'selected':''}>最近遊玩</option></select><button class="btn" data-act="clear-filter">清除</button></div><p class="filter-summary">顯示 ${list.length} 回</p><div class="chapter-grid">${list.map(ch=>chapterCard(ch,recentSet)).join('')}</div>`;}
  function chapterCard(ch,recentSet){const done=state.completed[String(ch.number)];const draft=state.runs[String(ch.number)]&&!state.runs[String(ch.number)].complete;return`<button class="chapter-card ${draft?'draft-mark':''}" data-chapter="${ch.number}"><span class="chapter-number">第 ${ch.number} 回</span><span class="chapter-icon">${ch.icon}</span><h3>${esc(ch.title)}</h3><p>${esc(ch.nickname)}・${esc(ch.name)}｜${esc(storyMode(ch).name)}</p><small>${esc(ch.focus)}</small>${done?`<span class="grade ${done.grade}">${done.grade}</span>`:''}${recentSet.has(ch.number)?'<span class="recent-mark">最近遊玩</span>':''}</button>`;}

  function renderChapter(){const run=state.current;if(!run)return renderHome();screen='chapter';clearAutoTimer();const ch=currentChapter();const flow=flowForChapter(ch);const stepIndex=currentStepIndex(run);const choice=chosenStory(run);const nextBattle=flow.slice(stepIndex).find(x=>x.type==='battle');const intel=nextBattle?battleIntel(ch,nextBattle.index):null;app.innerHTML=`${topbar(`第 ${ch.number} 回`)}${nav()}<section class="chapter-hero"><div class="chapter-symbol">${ch.icon}</div><div><span class="eyebrow">${esc(ch.era)}・${esc(storyMode(ch).name)}</span><h1>${esc(ch.title)}</h1><h2>${esc(ch.nickname)}・${esc(ch.name)}</h2><p>${esc(chapterIntro(ch))}</p></div></section>${materialsBar()}${!run.choice?storyChoicePanel(ch):`<section class="card choice-summary"><b>${storyMode(ch).icon} 已選方案：${esc(choice.title)}</b><p>${esc(choice.text)}</p></section>`}${intel?renderIntel(ch,intel,nextBattle.index):''}<div class="grid two" style="margin-top:16px"><section class="card"><h2>章回流程</h2><div class="story-flow">${flow.map((step,i)=>renderFlowStep(run,step,i,stepIndex,ch)).join('')}</div></section><aside><section class="card"><h2>章回主角客將</h2>${heroMini(ch.number,'back')}<p>若主角未在目前四人隊伍，戰鬥時會以第五名客將加入；存活完成首領戰可取得專屬成就。</p><div class="actions"><button class="btn" data-act="team">調整編隊</button><button class="btn" data-act="claim-medicine">領用藥品（本回 ${run.medicines}/5）</button></div></section><section class="card" style="margin-top:14px"><h2>行動紀錄</h2><div class="log">${run.log.slice(0,10).map(x=>`<p>${esc(x)}</p>`).join('')}</div></section></aside></div>`;}
  function storyChoicePanel(ch){const mode=storyMode(ch);return`<section class="card story-choice"><span class="eyebrow">先作出本回關鍵選擇</span><h2>${mode.icon} ${esc(mode.name)}</h2><div class="choice-grid">${mode.choices.map(c=>`<button class="choice-card" data-story-choice="${c.key}"><b>${esc(c.title)}</b><p>${esc(c.text)}</p></button>`).join('')}</div></section>`;}
  function renderIntel(ch,intel,stage){return`<section class="card intel-panel"><div><span class="eyebrow">戰前敵情・第 ${stage+1} 場</span><h2>${intel.boss?'首領情報':'敵軍偵察'}</h2><p>${esc(intel.text)}</p></div><div class="intel-tags"><span class="tag">預估敵人 ${intel.count}</span>${intel.recommend.map(x=>`<span class="tag good">推薦 ${esc(x)}</span>`).join('')}${intel.boss?`<span class="tag danger">${esc(intel.boss.name)}</span>`:''}</div></section>`;}
  function renderFlowStep(run,step,index,current,ch){const done=stepDone(run,step);const isCurrent=index===current&&!done;let title='';let text='';let button='';if(step.type==='clue'){const d=clueData(ch)[step.index];title=d.title;text=d.text;button=`<button class="btn ${isCurrent?'primary':''}" data-clue="${step.index}" ${isCurrent?'':'disabled'}>${done?'已查驗':'查驗'}</button>`;}if(step.type==='strategy'){const d=strategyData(ch)[step.index];title=d.title;text=d.text;button=`<button class="btn ${isCurrent?'primary':''}" data-strategy="${step.index}" ${isCurrent?'':'disabled'}>${done?'已完成':'執行'}</button>`;}if(step.type==='choiceEvent'){title='故事轉折';text='讓先前的選擇正式改變後續敵情與獎勵。';button=`<button class="btn ${isCurrent?'primary':''}" data-act="resolve-choice" ${isCurrent?'':'disabled'}>${done?'已發生':'推進劇情'}</button>`;}if(step.type==='battle'){title=['前哨交鋒','局勢轉折戰','三階首領決戰'][step.index];text=step.index===2?`首領「${bossProfile(ch).name}」會在 70% 與 35% 強制換階。`:'依速度行動條與多敵人配置迎戰。';button=`<button class="btn ${isCurrent?'danger':''}" data-battle-start="${step.index}" ${isCurrent?'':'disabled'}>${done?'已勝利':'出戰'}</button>`;}if(step.type==='finish'){title='章回結算';text='計算評級、主角客將成就、故事決斷與養成獎勵。';button=`<button class="btn ${isCurrent?'good':''}" data-act="finish" ${isCurrent?'':'disabled'}>${done?'已結算':'完成本回'}</button>`;}return`<div class="flow-step ${done?'done':isCurrent?'current':'locked'}"><span class="flow-index">${done?'✓':index+1}</span><div><h3>${esc(title)}</h3><p>${esc(text)}</p></div>${button}</div>`;}

  function renderBattle(){const run=state.current;const b=run?.battle;if(!b)return renderChapter();screen='battle';const actor=currentActor(b);const target=selectedEnemy(b);const bond=activeBonds().find(x=>x.name===b.activeBond);app.innerHTML=`${topbar(`第 ${currentChapter().number} 回・戰鬥`)}${nav()}<div class="battle-toolbar"><div><b>第 ${b.round} 回合・${actor?`${actor.team==='ally'?'我方':'敵方'} ${esc(actor.name)} 行動`:'整理行動條'}</b><small>全體依速度排序；所有單位行動完畢後才結算持續狀態。</small></div><div class="actions"><button class="btn ${b.speed===1?'primary':''}" data-speed="1">×1</button><button class="btn ${b.speed===2?'primary':''}" data-speed="2">×2</button><button class="btn ${b.speed===3?'primary':''}" data-speed="3">×3</button><button class="btn ${b.auto?'good':''}" data-act="toggle-auto">自動 ${b.auto?'開':'關'}</button></div></div>${b.phaseNotice?`<div class="boss-phase-alert">⚠️ ${esc(b.phaseNotice)}</div>`:''}<section class="initiative-strip">${b.queue.map((token,i)=>{const u=findUnit(b,token);return`<span class="initiative-token ${i===b.cursor?'current':''} ${u?.team||''} ${!u?.alive?'fallen':''}">${u?.team==='ally'?'🟢':'🔴'} ${esc(u?.name||'')}</span>`;}).join('')}</section><div class="combat-board"><section><h2>我方隊伍</h2><div class="combat-team">${b.allies.map(a=>unitCard(a,actor?.id===a.id,false)).join('')}</div></section><section><h2>敵方陣營</h2><div class="combat-team">${b.enemies.map((e,i)=>unitCard(e,false,i===b.targetIndex)).join('')}</div></section></div><section class="card active-panel"><div class="portrait"><div class="avatar">${actor?.team==='ally'?esc(actor.name[0]):'敵'}</div><div><span class="tag ${actor?.team==='ally'?'good':'danger'}">${actor?.team==='ally'?'我方行動':'敵方思考中'}</span><h2>${esc(actor?.name||'整理回合')}</h2><p>${actor?.team==='ally'?`${esc(actor.kit.skillName)}・速度 ${actor.speed}`:'敵人會依首領階段與角色類型選擇招式。'}</p></div></div>${actor?.team==='ally'?battleActions(actor,target,b,bond):'<p>敵方回合將自動執行，完成後輪到下一名速度序列角色。</p>'}</section><section class="card" style="margin-top:14px"><h2>戰鬥紀錄</h2><div class="log">${b.log.slice(0,18).map(x=>`<p>${esc(x)}</p>`).join('')}</div></section>`;}
  function unitCard(u,active,targeted){const status=Object.entries(u.statuses||{}).filter(([,v])=>v?.duration>0).map(([k,v])=>`<span class="status-effect ${['power','haste','counter'].includes(k)?'good':''}">${statusLabel(k)} ${v.duration>=90?'常駐':v.duration}</span>`).join('');const phase=u.type==='boss'?`・第 ${u.phase} 階段`:'';const set=u.team==='ally'?equipmentSetBonus(u.number):null;return`<button class="unit-card ${active?'active':''} ${targeted?'targeted':''} ${!u.alive?'fallen':''}" ${u.team==='enemy'?'data-target="'+state.current.battle.enemies.indexOf(u)+'"':''}><div class="unit-head"><span class="avatar small-avatar">${u.icon||u.name[0]}</span><div><b>${esc(u.nickname?`${u.nickname}・${u.name}`:u.name)}${u.guest?'（客將）':''}</b><small>${u.team==='ally'?`${u.row==='front'?'前排':'後排'}・速度 ${u.speed}${set?`・${set.name}`:''}`:`${u.type}${phase}・速度 ${u.speed}`}</small></div></div><div class="statline"><span>氣血</span><div class="bar hp"><i style="width:${pct(u.hp,u.maxHp)}%"></i></div><b>${Math.max(0,Math.round(u.hp))}/${u.maxHp}</b></div>${u.team==='ally'?`<div class="statline"><span>豪氣</span><div class="bar sp"><i style="width:${pct(u.sp,u.maxSp)}%"></i></div><b>${Math.round(u.sp)}/${u.maxSp}</b></div>`:''}${u.shield>0?`<small>護盾 ${Math.round(u.shield)}</small>`:''}<div>${status}</div>${u.type==='boss'?`<small class="mechanic-note">${esc(u.mechanic.name)}：${esc(u.mechanic.text)}</small>`:''}</button>`;}
  function battleActions(actor,target,b,bond){const skill=skillCost(actor,'skill'),system=skillCost(actor,'system');return`<div class="battle-actions"><button class="btn primary" data-battle-action="attack">普通攻擊</button><button class="btn" data-battle-action="skill" ${actor.sp<skill?'disabled':''}>${esc(actor.kit.skillName)}（${skill}）</button><button class="btn accent" data-battle-action="system" ${actor.sp<system?'disabled':''}>${esc(actor.kit.awakeningName)}（${system}）</button><button class="btn" data-battle-action="guard">守勢回氣</button><button class="btn" data-battle-action="medicine" ${state.current.medicines<=0?'disabled':''}>金瘡藥 ${state.current.medicines}</button><button class="btn good" data-battle-action="combo" ${!bond||b.comboGauge<100?'disabled':''}>${bond?esc(bond.name):'無羈絆'} ${b.comboGauge}%</button></div><p class="muted">目前目標：${esc(target?.name||'無')}。首領傷害跨越換階門檻時會自動停住並立即觸發新階段。</p>`;}

  function renderEnding(){const run=state.current;const ch=currentChapter();screen='ending';app.innerHTML=`${topbar('章回完成')}${nav()}<section class="ending"><span class="eyebrow">CHAPTER COMPLETE</span><div class="grade huge ${run.grade}">${run.grade}</div><h1>第 ${ch.number} 回完成</h1><h2>${esc(ch.title)}</h2><p>分數 ${run.score}・行動 ${run.stats.actions}・完整回合 ${run.stats.rounds}・銀兩 ${run.silverEarned}</p><div class="achievement-grid">${run.achievements.map(x=>`<div class="achievement"><span class="medal">🏅</span><div><b>${esc(x)}</b><p>本次章回已解鎖</p></div></div>`).join('')}</div><div class="actions"><button class="btn primary" data-act="next">下一回</button><button class="btn" data-act="replay">重新挑戰</button><button class="btn" data-act="heroes">培養主角</button><button class="btn" data-act="home">返回首頁</button></div></section>`;}

  function renderTeam(){screen='team';clearAutoTimer();const unlocked=chapters.filter(ch=>heroUnlocked(ch.number));const bonds=activeBonds();app.innerHTML=`${topbar('多套編隊')}${nav()}<section class="page-head"><div><span class="eyebrow">FORMATION PLANS</span><h1>三套戰略編隊</h1><p>可保存三套前後排隊伍，戰前依敵情一鍵切換。</p></div></section><div class="formation-tabs">${state.formations.map((p,i)=>`<button class="btn ${i===state.activeFormation?'primary':''}" data-plan="${i}">${esc(p.name)}</button>`).join('')}</div><section class="card formation-board"><label>隊伍名稱<input class="field" data-plan-name="${state.activeFormation}" value="${esc(currentPlan().name)}"></label><div class="formation-row"><b>前排</b>${[0,1].map(i=>formationSlot('front',i,unlocked)).join('')}</div><div class="formation-row"><b>後排</b>${[0,1].map(i=>formationSlot('back',i,unlocked)).join('')}</div></section><div class="grid two" style="margin-top:16px"><section class="card"><h2>啟動羈絆</h2>${bonds.length?bonds.map(b=>`<div class="achievement"><span class="medal">🤝</span><div><b>${esc(b.name)}</b><p>${esc(b.text)}</p></div></div>`).join(''):'<p>尚未啟動羈絆。</p>'}</section><section class="card"><h2>戰前建議</h2><p>情報所會在章回頁顯示首領機制與推薦職業。主角不在四人隊伍時，會以第五名客將自動加入。</p><div class="actions"><button class="btn" data-act="chapters">選擇章回</button><button class="btn" data-act="heroes">配置技能</button></div></section></div>`;}
  function formationSlot(row,index,unlocked){const n=currentPlan()[row][index];return`<label class="formation-slot"><span class="avatar">${esc(chapter(n).name[0])}</span><div><b>${row==='front'?'前排':'後排'} ${index+1}</b><select class="field" data-formation="${row}-${index}">${unlocked.map(c=>`<option value="${c.number}" ${c.number===n?'selected':''}>${c.number}. ${esc(c.nickname)}・${esc(c.name)}（Lv.${getHero(c.number).level}${getHero(c.number).awakened?'・覺醒':''}）</option>`).join('')}</select><small>${esc(heroKit(n).passiveName)}</small></div></label>`;}

  function renderHeroes(){screen='heroes';clearAutoTimer();const q=heroSearch.trim().toLowerCase();const list=chapters.filter(ch=>heroUnlocked(ch.number)&&(!q||`${ch.number}${ch.name}${ch.nickname}${ch.title}`.toLowerCase().includes(q)));app.innerHTML=`${topbar('英雄覺醒')}${nav()}<section class="page-head"><div><span class="eyebrow">108 UNIQUE HEROES</span><h1>專屬技能與分支技能樹</h1><p>每名英雄都有不同的專屬技、被動與覺醒名稱；三系技能樹各有兩條互斥分支。</p></div><input class="field hero-search" id="heroSearch" placeholder="搜尋英雄" value="${esc(heroSearch)}"></section>${materialsBar()}<div class="hero-growth-grid">${list.map(heroGrowthCard).join('')}</div>`;}
  function heroGrowthCard(ch){const h=getHero(ch.number);const kit=heroKit(ch.number);const weapon=getItem(h.equipment.weapon);const armor=getItem(h.equipment.armor);const set=equipmentSetBonus(ch.number);return`<article class="card growth-card"><div class="portrait"><div class="avatar">${esc(ch.name[0])}</div><div><span class="tag accent">${esc(kindData(ch).label)}</span><h3>${esc(ch.nickname)}・${esc(ch.name)} ${h.awakened?'✦':''}</h3><p>Lv.${h.level}・技能點 ${h.skillPoints}</p></div></div><div class="statline"><span>經驗</span><div class="bar sp"><i style="width:${pct(h.xp,xpNeeded(h.level))}%"></i></div><b>${h.xp}/${xpNeeded(h.level)}</b></div><div class="passive-box"><b>${kit.icon} ${esc(kit.passiveName)}</b><small>${esc(kit.passiveText)}</small></div><div class="awakening-box ${h.awakened?'awakened':''}"><b>${h.awakened?'✦ 已覺醒':'◇ 尚未覺醒'}：${esc(kit.awakeningName)}</b><small>${esc(kit.awakeningText)}</small></div>${Object.entries(TREE_OPTIONS).map(([key,tree])=>skillBranchHtml(ch.number,h,key,tree)).join('')}<div class="equipment-line"><span>${weapon?`${weapon.icon||'⚔️'} ${esc(weapon.name)} +${weapon.level}`:'武器：無'}</span><span>${armor?`${armor.icon||'🛡️'} ${esc(armor.name)} +${armor.level}`:'防具：無'}</span><span>${set?`套裝：${set.name}（${set.two}）`:'套裝：未啟動'}</span></div><div class="actions"><button class="btn small" data-equip-manual="weapon" data-hero="${ch.number}">選武器</button><button class="btn small" data-equip-manual="armor" data-hero="${ch.number}">選防具</button><button class="btn small" data-equip-best="${ch.number}">一鍵最佳</button><button class="btn small danger" data-reset-tree="${ch.number}">重置技能</button><button class="btn small accent" data-awaken="${ch.number}" ${h.awakened?'disabled':''}>覺醒</button></div></article>`;}
  function skillBranchHtml(number,h,key,tree){const node=h.tree[key];return`<div class="branch-row"><b>${tree.name} ${node.rank}/3</b>${tree.options.map(o=>`<button class="tree-node ${node.branch===o.key?'selected':''}" data-talent="${key}:${o.key}" data-hero="${number}" ${h.skillPoints<=0||node.rank>=3||(node.branch&&node.branch!==o.key)?'disabled':''}>${esc(o.name)}<small>${esc(o.text)}</small></button>`).join('')}</div>`;}

  function renderForge(){screen='forge';clearAutoTimer();const items=state.inventory.items.filter(x=>forgeFilter==='all'||x.type===forgeFilter).sort((a,b)=>itemPower(b)-itemPower(a));const wc=craftCost('weapon'),ac=craftCost('armor');app.innerHTML=`${topbar('裝備套裝')}${nav()}<section class="page-head"><div><span class="eyebrow">FORGE & SETS</span><h1>武器、防具與套裝效果</h1><p>可手動比較裝備；同名套裝的武器與防具同時裝備，即啟動二件套效果。</p></div><div class="actions"><button class="btn primary" data-craft="weapon">鍛造武器 ${wc.silver}</button><button class="btn primary" data-craft="armor">鍛造防具 ${ac.silver}</button></div></section>${materialsBar()}<div class="filter-summary"><button class="btn small ${forgeFilter==='all'?'primary':''}" data-forge-filter="all">全部</button><button class="btn small ${forgeFilter==='weapon'?'primary':''}" data-forge-filter="weapon">武器</button><button class="btn small ${forgeFilter==='armor'?'primary':''}" data-forge-filter="armor">防具</button><button class="btn small" data-act="buy-medicine">購買金瘡藥</button></div><div class="set-guide">${Object.values(SETS).map(s=>`<span class="tag">${esc(s.name)}：${esc(s.two)}</span>`).join('')}</div><div class="equipment-grid">${items.map(itemCard).join('')}</div>`;}
  function itemCard(item){const stats=itemStats(item);const owner=item.equippedBy?chapter(item.equippedBy).name:'';const set=item.setKey?SETS[item.setKey]:null;return`<article class="equipment-card ${RARITIES[item.rarity].color}"><div class="equipment-icon">${item.icon||(item.type==='weapon'?'⚔️':'🛡️')}</div><div><span class="tag ${RARITIES[item.rarity].color}">${RARITIES[item.rarity].name}</span>${set?`<span class="tag good">${esc(set.name)}</span>`:''}<h3>${esc(item.name)} +${item.level}</h3><p>${Object.entries(stats).map(([k,v])=>`${({atk:'攻擊',def:'防禦',hp:'生命',sp:'豪氣',crit:'暴擊',status:'狀態率',speed:'速度',heal:'治療'})[k]||k} ${['crit'].includes(k)?Math.round(v*100)+'%':Math.round(v)}`).join('・')}</p><small>${owner?`已由 ${esc(owner)} 裝備`:'未裝備'}・戰力 ${Math.round(itemPower(item))}</small></div><div class="equipment-actions"><button class="btn small" data-upgrade-item="${item.id}" ${item.level>=5?'disabled':''}>強化</button><button class="btn small danger" data-dismantle="${item.id}" ${owner?'disabled':''}>分解</button></div></article>`;}

  function renderBase(){screen='base';clearAutoTimer();app.innerHTML=`${topbar('梁山寨')}${nav()}<section class="page-head"><div><span class="eyebrow">LIANGSHAN BASE</span><h1>山寨建設</h1><p>建築會影響生命、速度、鍛造、治療、後排傷害與戰前情報。</p></div></section>${materialsBar()}<div class="base-grid">${Object.entries(BUILDINGS).map(([k,b])=>buildingCard(k,b)).join('')}</div>`;}
  function buildingCard(key,b){const lv=buildingLevel(key);const c=buildingCost(key);const mat=c.material==='iron'?'鐵礦':c.material==='wood'?'木材':'布料';return`<article class="card building-card"><div class="building-icon">${b.icon}</div><div><span class="tag accent">Lv.${lv}/5</span><h2>${esc(b.name)}</h2><p>${esc(b.text)}</p><div class="level-pips">${[1,2,3,4,5].map(n=>`<i class="${n<=lv?'on':''}"></i>`).join('')}</div><small>${buildingEffect(key,lv)}</small></div><button class="btn primary" data-building="${key}" ${lv>=5?'disabled':''}>${lv>=5?'已滿級':`升級：${c.silver} 銀兩＋${c.amount} ${mat}${c.essence?`＋${c.essence} 精華`:''}`}</button></article>`;}
  function buildingEffect(key,lv){return({hall:`全隊生命＋${lv*2.5}%，經驗＋${lv*4}%`,smithy:`裝備能力＋${lv*2}，高稀有率提升`,infirmary:`藥品治療＋${lv*45}`,stable:`速度＋${lv*3}、初始豪氣與自動戰鬥效率提升`,waterCamp:`水軍與後排傷害＋${lv*2.5}%`,intelligence:`暴擊＋${lv}%並顯示首領階段與推薦職業`})[key];}

  function render(){document.body.dataset.theme=prefs.theme;if(screen==='home')renderHome();else if(screen==='chapters')renderChapters();else if(screen==='chapter')renderChapter();else if(screen==='battle')renderBattle();else if(screen==='ending')renderEnding();else if(screen==='team')renderTeam();else if(screen==='heroes')renderHeroes();else if(screen==='forge')renderForge();else if(screen==='base')renderBase();}
  function openModal(title,content){modalRoot.innerHTML=`<div class="modal-backdrop" data-backdrop-close><section class="modal"><div class="modal-head"><h2>${esc(title)}</h2><button class="btn icon" data-modal="close">×</button></div>${content}</section></div>`;}
  function closeModal(){modalRoot.innerHTML='';}
  async function openManage(){await refreshBackupMeta();let backups=[];try{backups=(await idbAll('backups')).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));}catch{}const payload=JSON.stringify({version:VERSION,exportedAt:now(),state,prefs},null,2);openModal('存檔管理',`<p>主要進度寫入 IndexedDB，並保留 localStorage 相容鏡像；最近自動保留 ${MAX_BACKUPS} 份備份。</p><textarea id="saveText">${esc(payload)}</textarea><div class="actions"><button class="btn" data-modal="copy">複製</button><button class="btn" data-modal="download">下載</button><button class="btn primary" data-modal="import">匯入</button><button class="btn good" data-modal="backup-now">立即備份</button><button class="btn danger" data-modal="reset-all">重設全部</button></div><h3>輪替備份</h3><div class="backup-list">${backups.map(b=>`<button class="backup-row" data-modal="restore-backup" data-backup="${b.id}"><b>${esc(b.reason)}</b><small>${new Date(b.createdAt).toLocaleString('zh-TW')}</small></button>`).join('')||'<p>尚無 IndexedDB 備份。</p>'}</div><p class="muted">${esc(state.migration.note||'')} ${esc(state.saveMeta.warning||'')}</p>`);}
  function openReleaseNotes(){openModal('v7.3.0 更新內容',`<ul><li>完整速度回合與行動條</li><li>首領 70%／35% 強制換階與差異招式</li><li>108 名英雄專屬技、被動與覺醒</li><li>三系雙分支技能樹及重置</li><li>三套編隊、戰前敵情與主角客將</li><li>手動裝備比較與五種二件套</li><li>十類章回故事抉擇及四種流程</li><li>IndexedDB 主存檔與五份輪替備份</li><li>GitHub Pages Actions 部署與子路徑 PWA 驗收</li></ul><div class="actions"><button class="btn" data-modal="close">關閉</button></div>`);}
  function toast(message,type=''){const node=document.createElement('div');node.className=`toast ${type}`;node.textContent=message;toastRoot.appendChild(node);setTimeout(()=>node.remove(),2800);}
  function tone(type){if(!prefs.sound)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain();o.frequency.value=({hit:180,hurt:105,skill:410,guard:280,save:340,battle:145,victory:600,achievement:760}[type]||300);g.gain.setValueAtTime(.035,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.14);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.15);}catch{}}
  function speakPage(){if(!('speechSynthesis'in window))return toast('此瀏覽器不支援語音朗讀。','warn');speechSynthesis.cancel();const text=app.innerText.slice(0,5000);const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.95;speechSynthesis.speak(u);toast('開始朗讀本頁。','good');}
  function cycleTheme(){const order=['ink','dark','paper'];prefs.theme=order[(order.indexOf(prefs.theme)+1)%order.length];save(true);render();}
  function downloadText(filename,text,mime='application/json'){const blob=new Blob([text],{type:`${mime};charset=utf-8`});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function importSaveText(text){const parsed=JSON.parse(text);const incoming=parsed?.state||parsed;if(!incoming||typeof incoming!=='object'||!incoming.completed)throw new Error('invalid');createBackup('匯入前備份');state=mergeState(incoming);if(parsed?.prefs)prefs={...freshPrefs(),...parsed.prefs};save(true);}
  function showUpdateAvailable(registration){swRegistration=registration;updateRoot.innerHTML=`<aside class="update-banner"><div><b>發現新版遊戲</b><small>更新前會建立 IndexedDB 備份並保存章回、覺醒、編隊與裝備。</small></div><div class="actions"><button class="btn small" data-act="release-notes">更新內容</button><button class="btn small primary" data-act="apply-update">立即更新</button><button class="btn small" data-act="dismiss-update">稍後</button></div></aside>`;}
  function registerServiceWorker(){if(!('serviceWorker'in navigator)||location.protocol==='file:')return;navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).then(reg=>{swRegistration=reg;if(reg.waiting)showUpdateAvailable(reg);reg.addEventListener('updatefound',()=>{const w=reg.installing;w?.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdateAvailable(reg);});});reg.update().catch(()=>{});}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload();});}

  app.addEventListener('click',event=>{
    const chapterButton=event.target.closest('[data-chapter]');if(chapterButton){openChapterChoice(chapterButton.dataset.chapter);return;}
    const storyChoice=event.target.closest('[data-story-choice]');if(storyChoice){chooseStory(storyChoice.dataset.storyChoice);return;}
    const clue=event.target.closest('[data-clue]');if(clue){collectClue(clue.dataset.clue);return;}
    const strategy=event.target.closest('[data-strategy]');if(strategy){doStrategy(strategy.dataset.strategy);return;}
    const start=event.target.closest('[data-battle-start]');if(start){startBattle(start.dataset.battleStart);return;}
    const action=event.target.closest('[data-battle-action]');if(action){battleAction(action.dataset.battleAction);return;}
    const target=event.target.closest('[data-target]');if(target&&state.current?.battle){state.current.battle.targetIndex=Number(target.dataset.target);save(true);renderBattle();return;}
    const speed=event.target.closest('[data-speed]');if(speed){setBattleSpeed(speed.dataset.speed);return;}
    const plan=event.target.closest('[data-plan]');if(plan){setActiveFormation(plan.dataset.plan);return;}
    const talent=event.target.closest('[data-talent]');if(talent){const[category,branch]=talent.dataset.talent.split(':');selectTalent(Number(talent.dataset.hero),category,branch);return;}
    const reset=event.target.closest('[data-reset-tree]');if(reset){resetTalents(Number(reset.dataset.resetTree));return;}
    const awaken=event.target.closest('[data-awaken]');if(awaken){awakenHero(Number(awaken.dataset.awaken));return;}
    const manual=event.target.closest('[data-equip-manual]');if(manual){openEquipmentModal(Number(manual.dataset.hero),manual.dataset.equipManual);return;}
    const best=event.target.closest('[data-equip-best]');if(best){equipBest(Number(best.dataset.equipBest));return;}
    const craft=event.target.closest('[data-craft]');if(craft){craftItem(craft.dataset.craft);return;}
    const upItem=event.target.closest('[data-upgrade-item]');if(upItem){upgradeItem(upItem.dataset.upgradeItem);return;}
    const dismantle=event.target.closest('[data-dismantle]');if(dismantle){dismantleItem(dismantle.dataset.dismantle);return;}
    const filter=event.target.closest('[data-forge-filter]');if(filter){forgeFilter=filter.dataset.forgeFilter;renderForge();return;}
    const building=event.target.closest('[data-building]');if(building){upgradeBuilding(building.dataset.building);return;}
    const diff=event.target.closest('[data-difficulty]');if(diff&&state.current&&!state.current.battle){state.current.difficulty=diff.dataset.difficulty;prefs.difficulty=diff.dataset.difficulty;save(true);renderChapter();return;}
    const btn=event.target.closest('[data-act]');if(!btn)return;const act=btn.dataset.act;
    if(act==='home'){screen='home';render();}if(act==='chapters'){screen='chapters';render();}if(act==='team'){screen='team';render();}if(act==='heroes'){screen='heroes';render();}if(act==='forge'){screen='forge';render();}if(act==='base'){screen='base';render();}
    if(act==='continue'){if(state.current){screen=state.current.battle?'battle':state.current.complete?'ending':'chapter';render();if(screen==='battle')advanceToPlayable();}else openChapterChoice(firstIncomplete());}
    if(act==='clear-filter'){chapterSearch='';chapterEra='all';chapterStatus='all';renderChapters();}
    if(act==='resolve-choice')resolveChoiceEvent();if(act==='finish')finishChapter();if(act==='next')startChapter(Math.min(108,currentChapter().number+1),false);
    if(act==='replay'||act==='restart-current'){const n=currentChapter().number;openModal('重新挑戰確認',`<p>確定重新開始第 ${n} 回嗎？最佳完成紀錄、英雄等級、覺醒、裝備與建設均會保留。</p><div class="actions"><button class="btn danger" data-modal="chapter-restart" data-number="${n}">確定重新挑戰</button><button class="btn" data-modal="close">取消</button></div>`);}
    if(act==='claim-medicine')claimMedicine();if(act==='buy-medicine')buyMedicine();if(act==='toggle-auto')toggleAuto();if(act==='theme')cycleTheme();if(act==='speech')speakPage();if(act==='manage')openManage();if(act==='release-notes')openReleaseNotes();if(act==='dismiss-update')updateRoot.innerHTML='';if(act==='apply-update'&&swRegistration?.waiting){createBackup('PWA 更新前備份').then(()=>{save(true);swRegistration.waiting.postMessage({type:'SKIP_WAITING'});});}if(act==='install'&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>deferredPrompt=null);}
  });
  app.addEventListener('input',event=>{if(event.target.id==='chapterSearch'){chapterSearch=event.target.value;renderChapters();}if(event.target.id==='heroSearch'){heroSearch=event.target.value;renderHeroes();}if(event.target.matches('[data-plan-name]'))renameFormation(event.target.dataset.planName,event.target.value);});
  app.addEventListener('change',event=>{const select=event.target.closest('[data-formation]');if(select)setFormation(select.dataset.formation,select.value);if(event.target.id==='chapterEra'){chapterEra=event.target.value;renderChapters();}if(event.target.id==='chapterStatus'){chapterStatus=event.target.value;renderChapters();}});
  modalRoot.addEventListener('click',event=>{const backdrop=event.target.closest('[data-backdrop-close]');if(backdrop&&event.target===backdrop){closeModal();return;}const button=event.target.closest('[data-modal]');if(!button)return;const act=button.dataset.modal;if(act==='close'){closeModal();return;}if(['chapter-resume','chapter-restart','chapter-switch'].includes(act)){const n=Number(button.dataset.number);closeModal();startChapter(n,act==='chapter-restart');return;}if(act==='equip-item'){equipItem(Number(button.dataset.hero),button.dataset.item);return;}if(act==='restore-backup'){restoreBackup(button.dataset.backup);return;}const textarea=$('#saveText');if(act==='copy'&&textarea)navigator.clipboard?.writeText(textarea.value).then(()=>toast('存檔已複製。','good')).catch(()=>{});if(act==='download'&&textarea)downloadText(`Liangshan_v${VERSION}_save_${now().slice(0,10)}.json`,textarea.value);if(act==='backup-now'){createBackup('手動備份').then(()=>{closeModal();openManage();toast('已建立手動備份。','good');});}if(act==='import'&&textarea){try{importSaveText(textarea.value);closeModal();screen='home';render();toast('存檔匯入成功。','good');}catch{toast('存檔格式不正確。','warn');}}if(act==='reset-all'&&confirm('確定清除 v7 全部章回、英雄、裝備與建設進度嗎？')){createBackup('重設前備份');storage.removeItem(SAVE_KEY);state=mergeState(freshState());closeModal();screen='home';save(true);render();toast('全部進度已重設。','warn');}});

  window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredPrompt=event;});
  document.body.dataset.theme=prefs.theme;save(true,false);render();registerServiceWorker();hydrateFromIndexedDb();

  window.__LIANGSHAN_TEST__={
    version:VERSION,chapters,getState:()=>clone(state),getPrefs:()=>clone(prefs),flow:n=>clone(flowForChapter(chapter(n))),heroKit:n=>clone(heroKit(Number(n))),allHeroKits:()=>chapters.map(c=>heroKit(c.number)),storyMode:n=>clone(storyMode(chapter(n))),start:(n,force=true)=>startChapter(n,force),chooseStory,
    completeCurrentStep:()=>{const r=state.current;if(!r)return;if(!r.choice)chooseStory(storyMode(currentChapter()).choices[0].key);const step=flowForChapter(currentChapter())[currentStepIndex(r)];if(step.type==='clue')collectClue(step.index);else if(step.type==='strategy')doStrategy(step.index);else if(step.type==='choiceEvent')resolveChoiceEvent();else if(step.type==='battle'){r.battles[String(step.index)]=true;save(true);renderChapter();}else finishChapter();},
    autoComplete:n=>{startChapter(n,true);const r=state.current;r.choice=storyMode(currentChapter()).choices[0].key;r.choiceEventDone=true;r.clues=[0,1,2,3];r.strategies=[0,1,2,3,4];r.battles={0:true,1:true,2:true};r.stats.guestSurvived=true;finishChapter();},
    bulkAutoComplete:()=>{for(let n=1;n<=108;n++){const ch=chapter(n);const r=makeRun(n);r.choice=storyMode(ch).choices[0].key;r.choiceEventDone=true;r.clues=[0,1,2,3];r.strategies=[0,1,2,3,4];r.battles={0:true,1:true,2:true};r.stats.guestSurvived=true;state.current=r;const result=computeResult(r);r.complete=true;r.score=result.score;r.grade=result.grade;r.achievements=result.achievements;state.completed[String(n)]={grade:result.grade,score:result.score,actions:0,rounds:0,defeats:0,medicinesUsed:0,combos:0,guestSurvived:true,choice:r.choice,achievements:result.achievements,completedAt:now(),source:`v${VERSION} ${EDITION}`};state.runs[String(n)]=r;}state.unlocked=108;state.selected=108;save(true,false);screen='home';render();return Object.keys(state.completed).length;},
    setSilver:v=>{state.silver=Math.max(0,Number(v)||0);save(true);render();},setMaterials:v=>{state.inventory.materials={...state.inventory.materials,...v};save(true);render();},formations:()=>clone(state.formations),setActiveFormation,setFormation,activeBonds:()=>clone(activeBonds()),heroStats:n=>clone(heroCombatStats(Number(n),'front')),mergePreview:raw=>clone(mergeState(raw)),selectTalent,resetTalents,awakenHero,grantXp,equipBest,equipItem,craftItem,upgradeItem,dismantleItem,upgradeBuilding,heroKit,sets:clone(SETS),bonds:clone(BONDS),buildings:clone(BUILDINGS),
    prepareBattle:(n,stage=2)=>{startChapter(n,true);const r=state.current;r.choice=storyMode(currentChapter()).choices[0].key;r.choiceEventDone=true;r.clues=[0,1,2,3];r.strategies=[0,1,2,3,4];r.battles={0:stage>0,1:stage>1,2:false};startBattle(stage);},
    startBattle,battleAction,smartAction,currentActor:()=>clone(currentActor()),forceBossHit:damage=>{const b=state.current?.battle;const boss=b?.enemies.find(e=>e.type==='boss');if(!boss)return null;applyHit(boss,damage,{pierce:true,source:'測試'});save(true);renderBattle();return clone(boss);},forceWinBattle:()=>{const b=state.current?.battle;if(!b)return false;b.enemies.forEach(e=>{e.hp=0;e.alive=false;});battleVictory();return true;},simulateUpdate:()=>showUpdateAvailable({waiting:{postMessage:()=>{}}}),createBackup,backupCount:async()=>{try{return(await idbAll('backups')).length;}catch{return 0;}},idbStatus:()=>({hydrated:idbHydrated,backend:state.saveMeta.backend}),reset:()=>{storage.removeItem(SAVE_KEY);state=mergeState(freshState());save(true);screen='home';render();}
  };
})();
</script></body></html>
