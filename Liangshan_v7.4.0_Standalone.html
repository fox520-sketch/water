<script>
(() => {
  'use strict';
  const SCHEMA_VERSION = 4;
  const REQUIRED_TOP_LEVEL = ['version','silver','completed','inventory','heroes','formations','base'];

  function canonical(value) {
    if (Array.isArray(value)) return value.map(canonical);
    if (value && typeof value === 'object') {
      return Object.keys(value).sort().reduce((out,key) => {
        if (!['updatedAt','lastBackupAt','checksum'].includes(key)) out[key] = canonical(value[key]);
        return out;
      }, {});
    }
    return value;
  }

  async function checksum(value) {
    const text = JSON.stringify(canonical(value));
    if (globalThis.crypto?.subtle) {
      const bytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(bytes)].map(x => x.toString(16).padStart(2,'0')).join('');
    }
    let h = 2166136261;
    for (let i=0;i<text.length;i++) { h ^= text.charCodeAt(i); h = Math.imul(h,16777619); }
    return `fnv1a-${(h>>>0).toString(16).padStart(8,'0')}`;
  }

  function validateState(state) {
    const errors = [];
    if (!state || typeof state !== 'object') errors.push('存檔不是物件。');
    else {
      for (const key of REQUIRED_TOP_LEVEL) if (!(key in state)) errors.push(`缺少欄位：${key}`);
      if (state.completed && typeof state.completed !== 'object') errors.push('completed 格式錯誤。');
      if (state.heroes && typeof state.heroes !== 'object') errors.push('heroes 格式錯誤。');
      if (state.inventory && !Array.isArray(state.inventory.items)) errors.push('inventory.items 格式錯誤。');
      if (state.formations && !Array.isArray(state.formations)) errors.push('formations 格式錯誤。');
      if (Number(state.silver) < 0) errors.push('銀兩不可為負數。');
    }
    return {ok:errors.length===0,errors};
  }

  function validateExport(payload) {
    if (!payload || typeof payload !== 'object') return {ok:false,errors:['匯入內容不是有效物件。']};
    const state = payload.state || payload;
    const result = validateState(state);
    return {...result,state,prefs:payload.prefs||{},version:payload.version||state.version||'未知'};
  }

  function compare(localState, cloudState) {
    const l = new Date(localState?.updatedAt||0).getTime();
    const c = new Date(cloudState?.updatedAt||0).getTime();
    const localCompleted = Object.keys(localState?.completed||{}).length;
    const cloudCompleted = Object.keys(cloudState?.completed||{}).length;
    let recommendation = 'local';
    if (c > l + 1000 || cloudCompleted > localCompleted) recommendation = 'cloud';
    if (l === c && localCompleted === cloudCompleted) recommendation = 'same';
    return {localUpdatedAt:localState?.updatedAt||'',cloudUpdatedAt:cloudState?.updatedAt||'',localCompleted,cloudCompleted,recommendation};
  }

  window.LS74SaveSchema = {SCHEMA_VERSION,checksum,validateState,validateExport,compare,canonical};
})();

</script>
<script>
(() => {
  'use strict';
  const CONFIG_KEY = 'liangshan-v74-firebase-config';
  const SESSION_KEY = 'liangshan-v74-firebase-session';
  let config = null;
  let session = null;
  const safeLocal={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},remove:k=>{try{localStorage.removeItem(k)}catch{}}};
  const safeSession={get:k=>{try{return sessionStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch{}},remove:k=>{try{sessionStorage.removeItem(k)}catch{}}};

  function load() {
    try { config = JSON.parse(safeLocal.get(CONFIG_KEY)||'null'); } catch { config = null; }
    try { session = JSON.parse(safeSession.get(SESSION_KEY)||'null'); } catch { session = null; }
  }
  load();

  function validConfig(c) { return Boolean(c?.apiKey && c?.projectId); }
  function configure(c) {
    if (!validConfig(c)) throw new Error('Firebase 設定需包含 apiKey 與 projectId。');
    config = {apiKey:String(c.apiKey).trim(),projectId:String(c.projectId).trim(),authDomain:String(c.authDomain||'').trim()};
    safeLocal.set(CONFIG_KEY,JSON.stringify(config));
    return config;
  }
  function clearConfig(){ config=null;session=null;safeLocal.remove(CONFIG_KEY);safeSession.remove(SESSION_KEY); }

  function normalizeTree(raw){
    const out={power:{branch:null,rank:0},guard:{branch:null,rank:0},tactics:{branch:null,rank:0}};
    for(const key of Object.keys(out)){
      if(typeof raw?.[key]==='number'){out[key]={branch:TREE_OPTIONS[key].options[0].key,rank:clamp(Number(raw[key])||0,0,3)};continue;}
      const branch=raw?.[key]?.branch;out[key]={branch:TREE_OPTIONS[key].options.some(x=>x.key===branch)?branch:null,rank:clamp(Number(raw?.[key]?.rank)||0,0,3)};
    }
    return out;

  function openDb(){

  }

  function battleVictory(){clearAutoTimer();const run=state.current;if(run?.special)return specialBattleVictory();const b=run.battle;const stage=b.stage;const ch=currentChapter();const d=DIFFICULTIES[b.difficulty];const choice=chosenStory(run);const base=[125,200,335][stage]+ch.number*3;const tradeBonus=b.allies.filter(a=>a.kind==='trade').length*20;const bonus=b.enemies.reduce((s,e)=>s+Number(e.bonusSilver||0),0);const reward=Math.round((base+tradeBonus+bonus)*d.reward*(choice?.reward||1));const xp=Math.round(([75,120,195][stage]+ch.number)*d.xp*(1+buildingLevel('hall')*.04));const matMult=choice?.material||1;const materialReward={iron:Math.round((stage===2?5:2)*matMult),wood:Math.round((stage===1?4:2)*matMult),cloth:Math.round((stage===0?3:2)*matMult),essence:stage===2?2:0};run.battles[String(stage)]=true;run.silverEarned+=reward;state.silver+=reward;Object.entries(materialReward).forEach(([k,v])=>state.inventory.materials[k]+=v);b.allies.forEach(a=>{const h=getHero(a.number);h.wins++;const levels=grantXp(a.number,a.guest?Math.round(xp*.8):xp);if(levels.length)run.log.unshift(`${a.name}升至 ${levels.at(-1)} 級，獲得技能點。`);});if(stage===2){const protagonist=b.allies.find(a=>a.number===ch.number);run.stats.guestSurvived=Boolean(protagonist?.alive&&protagonist.hp>0);}run.medicines=Math.min(5,run.medicines+1);run.log.unshift(`第 ${stage+1} 場勝利：獲得 ${reward} 銀兩、英雄經驗與素材。`);run.battle=null;screen='chapter';save(true);if(stage===2)createBackup(`完成第 ${ch.number} 回首領戰`);toast(`戰鬥勝利，獲得 ${reward} 銀兩與養成素材。`,'good');tone('victory');render();}

  function computeResult(run){
    let score=100;
    score-=Math.max(0,run.stats.actions-30);
    score-=run.stats.defeats*12;
    score-=run.stats.medicinesUsed*4;
    score+=Math.min(6,run.stats.combos*2);
    score+=run.stats.guestSurvived?4:0;
    score+=run.trialSuccess?5:-3;
    score+=Number(run.trialEffect?.scoreBonus||0);
    if(run.trialEffect?.scoreCap)score=Math.min(score,run.trialEffect.scoreCap);
    score=clamp(Math.round(score),40,100);
    const grade=score>=90?'S':score>=78?'A':score>=65?'B':'C';
    const achievements=[];
    if(run.clues.length===4)achievements.push('明察四證');
    if(run.stats.defeats===0)achievements.push('三戰連捷');
    if(run.stats.medicinesUsed===0)achievements.push('無藥制勝');
    if(run.stats.combos>0)achievements.push('聚義合擊');
    if(run.stats.guestSurvived)achievements.push(`${currentChapter().nickname}主角無傷歸陣`);
    if(run.choiceEventDone)achievements.push(`${storyMode(currentChapter()).name}決斷`);
    if(run.trialSuccess)achievements.push(`${Content74?.trialForChapter(currentChapter())?.name||'章回考驗'}善策`);
    return{score,grade,achievements};
  }
  function finishChapter(){
    const run=state.current;

    const result=computeResult(run);
    const ch=currentChapter();
    run.complete=true;run.score=result.score;run.grade=result.grade;run.achievements=result.achievements;
    run.branchEnding=Content74?.branchEnding?.(ch,run)||{title:'聚義功成',text:'眾英雄平定本回風波。',key:'default'};
    const reward=230+ch.number*4+(run.trialSuccess?80:0);
    state.silver+=reward;run.silverEarned+=reward;
    state.inventory.materials.essence+=result.grade==='S'?3:1;
    const previous=state.completed[String(ch.number)];
    const record={grade:result.grade,score:result.score,actions:run.stats.actions,rounds:run.stats.rounds,defeats:run.stats.defeats,medicinesUsed:run.stats.medicinesUsed,combos:run.stats.combos,guestSurvived:run.stats.guestSurvived,choice:run.choice,trialSuccess:run.trialSuccess,trialKey:run.trialKey,branchEnding:run.branchEnding,achievements:result.achievements,completedAt:now(),source:`v${VERSION} ${EDITION}`};
    if(!previous||Number(previous.score||0)<=result.score)state.completed[String(ch.number)]=record;
    state.unlocked=Math.max(state.unlocked,Math.min(108,ch.number+1));state.selected=Math.min(108,ch.number+1);
    state.formations.forEach(p=>repairPlan(p));state.runs[String(ch.number)]=run;screen='ending';
    save(true);createBackup(`完成第 ${ch.number} 回`);render();tone('achievement');
  }
